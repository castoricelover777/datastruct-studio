opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4067;0.4222;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="541" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="570" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4844;0.5000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="601" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="630" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1733;0.1889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 330 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="330" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">i</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1733;0.1889;0.2511;0.2667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 390 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="390" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">i</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2511;0.2667;0.3289;0.3444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 450 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="450" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">i</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3289;0.3444;0.4067;0.4222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 510 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="510" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">i</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4067;0.4222;0.4844;0.5000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 570 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="570" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">i</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4844;0.5000;0.6511;0.6667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 630 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="630" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">i</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4844;0.5000;0.6733;0.6889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">n = 6 时加 6 次 —— 每转一圈加一次</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6733;0.6889;0.8733;0.8889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">n 涨 10 倍，次数也涨 10 倍：这就是&quot;成正比&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8733;0.8889;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">n=10 → 10 次　n=100 → 100 次　n=1000 → 1000 次</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0911;0.1111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第二档：单层循环，走 n 遍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0911;0.1111;0.2467;0.2667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">i 从 0 走到 n-1，每走一步加一次</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">for (i = 0; i &lt; n; i++)   cnt++;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2467;0.2667;0.4800;0.5000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 1 圈加 1 次，第 2 圈再加 1 次……</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4800;0.5000;0.6689;0.6889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">n = 6 就走 6 遍，加到 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6689;0.6889;0.8022;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">n 翻 10 倍，次数也翻 10 倍 —— 这就是线性阶 O(n)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8022;0.8222;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一眼判断：<tspan font-weight="700">单层循环、且循环次数和 n 挂钩 → O(n)</tspan></text></g></svg>