indefinite" calcMode="linear"/><line x1="532" y1="119" x2="536" y2="119" stroke="#D8DEE4" stroke-width="1.1" stroke-dasharray="3 3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1500;0.1667;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="420" y1="93" x2="433.77412914606253" y2="97.13223874381876" stroke="#8250DF" stroke-width="1.4" stroke-linecap="round"/>
    <animate attributeName="stroke-dashoffset" values="20.8806130178211;20.8806130178211;0;0;20.8806130178211" keyTimes="0;0.1643;0.2024;0.9995;1" dur="8.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 440 99 L 432.62473760379714 100.96354388470337 L 434.9235206883279 93.30093360293415 Z" fill="#8250DF"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1500;0.1667;0.8881;0.9048;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="418" y="210" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">前驱 prior</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8881;0.9048;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="418" y="210" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#6E7781">往回走的指针</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2929;0.3095;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">数据 data</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4357;0.4524;0.8881;0.9048;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="542" y="210" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">后继 next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8881;0.9048;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="542" y="210" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#6E7781">往后走的指针</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1452;0.1667;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">双向链表和单链表只差一个指针：每个结点多一个 prior</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1452;0.1667;0.2881;0.3095;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">prior 指向前一个结点 —— 这就是&quot;能往回走&quot;的本钱</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2881;0.3095;0.4310;0.4524;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">data 存数据，和单链表完全一样</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4310;0.4524;0.6929;0.7143;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">next 指向后一个结点</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">typedef struct DuLNode { ElemType data; struct DuLNode *prior; struct DuLNode *next; } DuLNode, *DuLinkList;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.6929;0.7143;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">多花一个指针的空间，换来两件事：能反向遍历、删除时不必再找前驱</text></g></svg>