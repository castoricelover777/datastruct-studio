    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05 · HeadInsert —— 头插法插入</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">双向头插必须判空，否则当场崩</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">双向链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3460;0.3600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="374" y1="110" x2="565" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 572 110 L 565 105.4 L 565 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="586" y1="128" x2="395" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 388 128 L 395 123.4 L 395 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3460;0.3600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="514" y1="110" x2="565" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.3580;0.3940;0.9996;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 572 110 L 565 105.4 L 565 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4660;0.4800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="586" y1="128" x2="535" y2="128" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.4780;0.5140;0.9996;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 528 128 L 535 123.4 L 535 132.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5660;0.5800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="446" y1="128" x2="395" y2="128" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.5780;0.6140;0.9996;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 388 128 L 395 123.4 L 395 132.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6660;0.6800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="374" y1="110" x2="425" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.6780;0.7140;0.9996;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 432 110 L 425 105.4 L 425 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="292" y="96" width="96" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="320" y1="96" x2="320" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="360" y1="96" x2="360" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="325" y1="135" x2="355" y2="103" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="306" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="374" cy="119" r="3.6" fill="#3B82F6"/><text x="340" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0" keyTimes="0;0.2400;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="432" y="96" width="96" height="46" rx="8" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><line x1="460" y1="96" x2="460" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="500" y1="96" x2="500" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="480" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><circle cx="446" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="514" cy="119" r="3.6" fill="#3B82F6"/><text x="480" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">s</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="572" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="600" y1="96" x2="600" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="640" y1="96" x2="640" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="620" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="586" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="654" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4680;0.4800;0.6680;0.6800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="569" y="93" width="34" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3460;0.3600;0.4660;0.4800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="172" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">① s-&gt;next = L-&gt;next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4660;0.4800;0.5660;0.5800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="172" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">② if (s-&gt;next != NULL)  s-&gt;next-&gt;prior = s</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5660;0.5800;0.6660;0.6800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="172" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">③ s-&gt;prior = L</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6660;0.6800;0.8060;0.8200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="172" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">④ L-&gt;next = s</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8060;0.8200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">空表时 L-&gt;next 是 NULL，②不判空就是对空指针取成员</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1020;0.1200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">双向链表的头插要动四根指针（单链表只要两根）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1020;0.1200;0.2220;0.2400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">头插依然不遍历，O(1) 完成</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">/* 但比单链表多两句：两个方向都要接上 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2220;0.2400;0.3420;0.3600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">造出新结点 s</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s = creatNode(e);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3420;0.3600;0.4620;0.4800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 新结点的 next 接住原来的第一个结点</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s-&gt;next = L-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4620;0.4800;0.5620;0.5800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 让原来第一个结点的 prior 改指 s —— 这一句必须判空！</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (s-&gt;next != NULL)   s-&gt;next-&gt;prior = s;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5620;0.5800;0.6620;0.6800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">③ 新结点的 prior 指向头结点（头结点一定存在，不用判空）</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s-&gt;prior = L;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6620;0.6800;0.8020;0.8200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">④ 头结点改指新结点</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">L-&gt;next = s;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8020;0.8200;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">空表时 L-&gt;next 是 NULL —— 少了那个 if，程序当场崩溃。这是双向头插最经典的坑</text></g></svg>