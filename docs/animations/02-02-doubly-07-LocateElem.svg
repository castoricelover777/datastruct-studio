t="indefinite" calcMode="linear"/><rect x="502" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="530" y1="96" x2="530" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="570" y1="96" x2="570" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="550" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="516" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="584" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9841;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><rect x="642" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="670" y1="96" x2="670" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="710" y1="96" x2="710" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="690" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="656" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="724" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1114;0.1250;0.2591;0.2727;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><rect x="387" y="93" width="46" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2591;0.2727;0.9864;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><rect x="527" y="93" width="46" height="52" rx="10" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0864;0.1023;0.9841;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;140.0 0;140.0 0" keyTimes="0.0000;0.1023;0.2727;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><path d="M 410 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="410" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1091;0.1250;0.2568;0.2727;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="242" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">10 != 20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2568;0.2727;0.5068;0.5227;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="358" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">20 == 20  命中</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5068;0.5227;0.8023;0.8182;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#8250DF">p-&gt;prior-&gt;data = 10，p-&gt;next-&gt;data = 30</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8023;0.8182;0.9841;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#6E7781">拿到结点地址后，两个方向的信息都在手里</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0818;0.1023;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">按值查找：拿数据域逐个比对</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0818;0.1023;0.2523;0.2727;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两个条件：没走到尾、且当前值不匹配</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p != NULL &amp;&amp; p-&gt;data != e)   p = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2523;0.2727;0.5023;0.5227;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">命中就停，p 停在第一个匹配的结点上</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5023;0.5227;0.7977;0.8182;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">双向链表的好处在这里体现：拿到结点就能同时说出前驱和后继</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7977;0.8182;0.9795;1.0000" dur="8.8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">返回的仍然是结点地址 —— 单链表和双向链表在这点上一致</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">return p;</text></g></svg>