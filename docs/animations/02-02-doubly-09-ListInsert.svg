  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">09 · ListInsert —— 按位插入</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">四根指针，缺一根就是断链</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">双向链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="304" y1="110" x2="355" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 362 110 L 355 105.4 L 355 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="376" y1="128" x2="325" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 318 128 L 325 123.4 L 325 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4096;0.4231;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="444" y1="110" x2="635" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 642 110 L 635 105.4 L 635 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5250;0.5385;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="656" y1="128" x2="465" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 458 128 L 465 123.4 L 465 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4096;0.4231;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="584" y1="110" x2="635" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.4212;0.4558;0.9996;1" dur="10.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 642 110 L 635 105.4 L 635 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5250;0.5385;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="656" y1="128" x2="605" y2="128" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.5365;0.5712;0.9996;1" dur="10.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 598 128 L 605 123.4 L 605 132.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6404;0.6538;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="516" y1="128" x2="465" y2="128" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.6519;0.6865;0.9996;1" dur="10.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 458 128 L 465 123.4 L 465 132.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7558;0.7692;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><line x1="444" y1="110" x2="495" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.7673;0.8019;0.9996;1" dur="10.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 502 110 L 495 105.4 L 495 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><rect x="222" y="96" width="96" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="250" y1="96" x2="250" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="290" y1="96" x2="290" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="255" y1="135" x2="285" y2="103" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="236" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="304" cy="119" r="3.6" fill="#3B82F6"/><text x="270" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><rect x="362" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="390" y1="96" x2="390" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="430" y1="96" x2="430" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="410" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="376" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="444" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2942;0.3077;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0" keyTimes="0;0.3077;1" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><rect x="502" y="96" width="96" height="46" rx="8" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><line x1="530" y1="96" x2="530" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="570" y1="96" x2="570" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="550" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text><circle cx="516" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="584" cy="119" r="3.6" fill="#3B82F6"/><text x="550" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">s</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><rect x="642" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="670" y1="96" x2="670" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="710" y1="96" x2="710" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="690" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="656" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="724" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0827;0.0962;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;140.0 0;140.0 0" keyTimes="0.0000;0.0962;0.2885;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 270 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="270" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4096;0.4231;0.5250;0.5385;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">① s-&gt;next = p-&gt;next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5250;0.5385;0.6404;0.6538;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">② if (p-&gt;next != NULL)  p-&gt;next-&gt;prior = s</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6404;0.6538;0.7558;0.7692;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">③ s-&gt;prior = p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7558;0.7692;0.8712;0.8846;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">④ p-&gt;next = s</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8712;0.8846;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#8250DF">①③ 是&quot;新结点指出去&quot;，②④ 是&quot;邻居指回来&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0788;0.0962;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">双向链表的按位插入要动四根指针 —— 单链表只要两根</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0788;0.0962;0.2904;0.3077;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">先定位到第 i-1 个结点（前驱），和单链表一样</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p != NULL &amp;&amp; j &lt; i - 1) { p = p-&gt;next; j++; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2904;0.3077;0.4058;0.4231;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">造出新结点 s</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (p == NULL || j &gt; i - 1) return ERROR;   s = creatNode(e);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4058;0.4231;0.5212;0.5385;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 新结点的 next 接住后面那一串</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s-&gt;next = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5212;0.5385;0.6365;0.6538;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 后面那个结点的 prior 改指新结点（插到表尾时这句要跳过）</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (p-&gt;next != NULL)   p-&gt;next-&gt;prior = s;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6365;0.6538;0.7519;0.7692;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">③ 新结点的 prior 指向前驱（前驱一定存在，不用判空）</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s-&gt;prior = p;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7519;0.7692;0.8673;0.8846;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">④ 前驱的 next 指向新结点，链表正式接上</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">p-&gt;next = s;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8673;0.8846;0.9827;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">四句缺一句，就会出现&quot;正着走没事、反着走崩掉&quot;—— 这是最难查的一类 bug</text></g></svg>