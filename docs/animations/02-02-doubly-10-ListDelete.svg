000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><rect x="642" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="670" y1="96" x2="670" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="710" y1="96" x2="710" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="690" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="656" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="724" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3538;0.3654;0.7192;0.7308;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><rect x="499" y="93" width="102" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0731;0.0865;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;140.0 0;140.0 0" keyTimes="0.0000;0.0865;0.2692;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 410 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="410" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0731;0.0865;0.4288;0.4423;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">注意：走 i 步，直接停在待删结点上（不是前驱）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5827;0.5962;0.7173;0.7308;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">① p-&gt;prior-&gt;next = p-&gt;next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4673;0.4808;0.5827;0.5962;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">② if (p-&gt;next != NULL)  p-&gt;next-&gt;prior = p-&gt;prior</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7558;0.7692;0.9865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#8250DF">p-&gt;prior 一定非空 —— 它至少是头结点，不用判空</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0692;0.0865;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">删除第 i 个结点 —— 这里能看出双向链表真正的价值</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0692;0.0865;0.2519;0.2692;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">单链表必须先找到前驱（走 i-1 步）；双向链表直接走到第 i 个结点自己</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">DuLNode *p = L-&gt;next;   int j = 1;
while (p != NULL &amp;&amp; j &lt; i) { p = p-&gt;next; j++; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2519;0.2692;0.4635;0.4808;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">p 就停在待删结点上，它自己带着 prior，压根不需要前驱变量</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4635;0.4808;0.5788;0.5962;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 后继的 prior 越过 p，直接指向前驱</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">p-&gt;prior-&gt;next = p-&gt;next;   /* 先取数据再 free */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5788;0.5962;0.7519;0.7692;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 前驱的 next 越过 p，直接指向后继</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (p-&gt;next != NULL)   p-&gt;next-&gt;prior = p-&gt;prior;   free(p);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7519;0.7692;0.9827;1.0000" dur="10.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">p-&gt;prior 不用判空：第 1 个数据结点的前驱就是头结点，头结点在这里又一次当了哨兵</text></g></svg>