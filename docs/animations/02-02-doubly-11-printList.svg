fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="530" y1="96" x2="530" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="570" y1="96" x2="570" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="550" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="516" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="584" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="642" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="670" y1="96" x2="670" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="710" y1="96" x2="710" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="690" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="656" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="724" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0786;0.0952;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;280.0 0;280.0 0" keyTimes="0.0000;0.0952;0.3214;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 410 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="410" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1262;0.1429;0.2095;0.2262;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="222" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#6E7781">&gt; 10 ⇄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2095;0.2262;0.2929;0.3095;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="222" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#6E7781">&gt; 10 ⇄ 20 ⇄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2929;0.3095;0.3762;0.3929;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="222" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#6E7781">&gt; 10 ⇄ 20 ⇄ 30 ⇄</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.3762;0.3929;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="222" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#6E7781">&gt; 10 ⇄ 20 ⇄ 30 ⇄ NULL</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0738;0.0952;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">正向遍历：和单链表写法完全一样</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0738;0.0952;0.3000;0.3214;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从第一个数据结点开始，只走 next 方向</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p != NULL) { printf(&quot;%d ⇄ &quot;, p-&gt;data); p = p-&gt;next; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3214;0.5024;0.5238;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">走到 NULL 就结束，补一个 NULL 收尾</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">printf(&quot;NULL\n&quot;);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5024;0.5238;0.6929;0.7143;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">输出里用 ⇄ 而不是 -&gt; ，是提醒这条链每个连接都是双向的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.6929;0.7143;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">真正体现双向价值的是下一个模块 —— 反向打印</text></g></svg>