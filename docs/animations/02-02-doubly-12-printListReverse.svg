  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">12 · printListReverse —— 反向打印</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">单链表做不到的事</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">双向链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="304" y1="110" x2="355" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 362 110 L 355 105.4 L 355 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="376" y1="128" x2="325" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 318 128 L 325 123.4 L 325 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="444" y1="110" x2="495" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 502 110 L 495 105.4 L 495 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3060;0.3200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="516" y1="128" x2="465" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 458 128 L 465 123.4 L 465 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="584" y1="110" x2="635" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 642 110 L 635 105.4 L 635 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3060;0.3200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="656" y1="128" x2="605" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 598 128 L 605 123.4 L 605 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3260;0.3400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="516" y1="128" x2="465" y2="128" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.3180;0.3540;0.9996;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 458 128 L 465 123.4 L 465 132.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3260;0.3400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="656" y1="128" x2="605" y2="128" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="58 58" stroke-dashoffset="58"><animate attributeName="stroke-dashoffset" values="58;58;0;0;58" keyTimes="0;0.3180;0.3540;0.9996;1" dur="10s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 598 128 L 605 123.4 L 605 132.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="222" y="96" width="96" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="250" y1="96" x2="250" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="290" y1="96" x2="290" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="255" y1="135" x2="285" y2="103" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="236" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="304" cy="119" r="3.6" fill="#3B82F6"/><text x="270" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="362" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="390" y1="96" x2="390" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="430" y1="96" x2="430" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="410" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="376" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="444" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="502" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="530" y1="96" x2="530" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="570" y1="96" x2="570" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="550" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="516" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="584" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="642" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="670" y1="96" x2="670" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="710" y1="96" x2="710" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="690" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="656" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="724" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2480;0.2600;0.3280;0.3400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="639" y="93" width="102" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6280;0.6400;0.7480;0.7600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="219" y="93" width="102" height="52" rx="10" fill="#D29922" fill-opacity="0.10" stroke="#D29922" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0660;0.0800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;280.0 0;0.0 0;0.0 0" keyTimes="0.0000;0.0800;0.2600;0.6400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 410 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="410" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0860;0.1000;0.3060;0.3200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="222" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">第一步：先沿 next 走到尾结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3460;0.3600;0.6860;0.7000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="222" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#8250DF">&gt; 30 ⇄ 20 ⇄ 10 ⇄ NULL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">p != L —— 撞到头结点就停，绝不能打印它</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0820;0.1000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">反向打印 —— 这就是双向链表多一个指针换来的能力</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0820;0.1000;0.2420;0.2600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">单链表想倒着打印，只能靠递归（爆栈）或者把数据拷进数组（额外空间）</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">/* 双向链表：prior 就在结点里，直接往回走 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2420;0.2600;0.3420;0.3600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第一步：先沿 next 找到尾结点</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p-&gt;next != NULL)   p = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3420;0.3600;0.6820;0.7000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第二步：顺着 prior 一路往回，边走边打印</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p != L) { printf(&quot;%d ⇄ &quot;, p-&gt;data); p = p-&gt;prior; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6820;0.7000;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">终止条件必须是 p != L —— 写成 p != NULL 会把头结点的垃圾值也打出来</text></g></svg>