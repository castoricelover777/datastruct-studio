<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="头文件与 typedef"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#3B82F6">
      <animate attributeName="width" values="0;888" dur="8s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">01 · 头文件与 typedef</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">一个结点里到底装了什么</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><rect x="446" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="480" y1="96" x2="480" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="463" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="497" cy="119" r="3.6" fill="#3B82F6"/><text x="480" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">LNode</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1325;0.1500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="344" y1="121" x2="446" y2="119" stroke="#D8DEE4" stroke-width="1.1" stroke-dasharray="3 3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2825;0.3000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="514" y1="119" x2="616" y2="121" stroke="#D8DEE4" stroke-width="1.1" stroke-dasharray="3 3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1325;0.1500;0.8825;0.9000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="336" y="210" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">数据域 data</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2825;0.3000;0.8825;0.9000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="624" y="210" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">指针域 next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8825;0.9000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="336" y="210" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#6E7781">存具体元素</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8825;0.9000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="624" y="210" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#6E7781">存下一个结点在哪</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">struct LNode</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1275;0.1500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一个链表结点由两部分组成：数据域 + 指针域</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1275;0.1500;0.2775;0.3000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">data 存具体元素；它是什么类型由 ElemType 决定</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2775;0.3000;0.4650;0.4875;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">next 存&quot;下一个结点的地址&quot;，它就是链表能串起来的原因</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4650;0.4875;0.7275;0.7500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">typedef 把这套写法包成两个短名字：</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">typedef struct LNode { ElemType data; struct LNode *next; } LNode, *LinkList;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7275;0.7500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">LNode 是结点类型，LinkList 是指向结点的指针类型（少写一个 *）</text></g></svg>