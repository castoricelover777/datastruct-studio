  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">02 · creatNode —— 创建新结点</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">申请一块内存，填好两个域</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="446" y="96" width="68" height="46" rx="8" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><line x1="480" y1="96" x2="480" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="463" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text><circle cx="497" cy="119" r="3.6" fill="#3B82F6"/><text x="480" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">p</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2714;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="443" y="93" width="74" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4381;0.4524;0.5810;0.5952;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="443" y="93" width="40" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5810;0.5952;0.7476;0.7619;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="477" y="93" width="40" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1262;0.1429;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 480 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="480" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2690;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">malloc(sizeof(LNode)) —— 申请到一块内存</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2690;0.2857;0.4357;0.4524;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#6E7781">必须检查 p == NULL，否则后面全是非法访问</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4357;0.4524;0.5786;0.5952;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">p-&gt;data = e</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5786;0.5952;0.7452;0.7619;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">p-&gt;next = NULL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7452;0.7619;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">return p —— 把地址交给调用者</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0976;0.1190;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">任何插入操作的第一步都一样：先造出一个新结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0976;0.1190;0.2643;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">向系统要一块正好的内存</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">LNode *p = (LNode *)malloc(sizeof(LNode));</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2643;0.2857;0.4310;0.4524;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">要养成习惯：申请完立刻检查是否失败</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (p == NULL) { printf(&quot;内存分配失败\n&quot;); exit(OVERFLOW); }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4310;0.4524;0.5738;0.5952;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">填入数据域</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">p-&gt;data = e;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5738;0.5952;0.7405;0.7619;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">指针域必须置 NULL —— 漏了它就是野指针</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">p-&gt;next = NULL;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7405;0.7619;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后把地址返回，这个&quot;孤立的结点&quot;就交给调用者了</text></g></svg>