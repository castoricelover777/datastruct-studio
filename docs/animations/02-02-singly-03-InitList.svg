<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="InitList —— 初始化链表"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#3B82F6">
      <animate attributeName="width" values="0;888" dur="7.2s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">03 · InitList —— 初始化链表</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">建立只有头结点的空表</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9806;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><rect x="446" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="480" y1="96" x2="480" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="452" y1="134" x2="474" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="497" cy="119" r="3.6" fill="#3B82F6"/><text x="480" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3444;0.3611;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><rect x="443" y="93" width="74" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4556;0.4722;0.6778;0.6944;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><rect x="477" y="93" width="40" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1472;0.1667;0.4528;0.4722;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="182" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#6E7781">头结点不存数据，它只当&quot;哨兵&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4528;0.4722;0.7306;0.7500;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="182" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">(*L)-&gt;next = NULL  →  这就是空表</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4528;0.4722;0.9806;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="546" y="NaN" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#8C959F">NULL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7306;0.7500;0.9806;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="182" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#6E7781">有了头结点，插入删除就不用特判第一个位置</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1139;0.1389;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">初始化 = 建一个&quot;只有头结点&quot;的空表</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1139;0.1389;0.4472;0.4722;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">头结点是哨兵：不存有效数据，只为让代码不用特判第一个位置</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">*L = (LinkList)malloc(sizeof(LNode));</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4472;0.4722;0.7250;0.7500;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">头结点的 next 置 NULL，空表就建好了</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">(*L)-&gt;next = NULL;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7250;0.7500;0.9750;1.0000" dur="7.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意参数是 LinkList *（二级指针）—— 要改调用者手里的 L 本身</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (*L == NULL) return ERROR;   (*L)-&gt;next = NULL;   return OK;</text></g></svg>