      <animate attributeName="width" values="0;888" dur="8.4s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">04 · applist —— 尾部追加节点</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">从头走到尾，把新结点挂上去</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="265" y1="110" x2="323" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 330 110 L 323 105.4 L 323 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="381" y1="110" x2="439" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 446 110 L 439 105.4 L 439 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="497" y1="110" x2="555" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 562 110 L 555 105.4 L 555 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5190;0.5357;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="613" y1="110" x2="671" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="65 65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" values="65;65;0;0;65" keyTimes="0;0.5333;0.5762;0.9996;1" dur="8.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 678 110 L 671 105.4 L 671 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="214" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="248" y1="96" x2="248" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="220" y1="134" x2="242" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="265" cy="119" r="3.6" fill="#3B82F6"/><text x="248" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="330" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="364" y1="96" x2="364" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="347" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="381" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="446" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="480" y1="96" x2="480" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="463" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="497" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="562" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="596" y1="96" x2="596" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="579" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="613" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4000;0.4167;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0" keyTimes="0;0.4167;1" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="678" y="96" width="68" height="46" rx="8" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><line x1="712" y1="96" x2="712" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="695" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">40</text><circle cx="729" cy="119" r="3.6" fill="#3B82F6"/><text x="712" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">s</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0905;0.1071;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;348.0 0;348.0 0" keyTimes="0.0000;0.1071;0.3333;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 248 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="248" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0905;0.1071;0.3167;0.3333;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="248" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">p 出发 → 沿 next 一路向后</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6500;0.6667;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="712" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">新结点挂到尾部</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0857;0.1071;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">尾插不改变已有结点的顺序，但要先找到&quot;最后一个结点&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0857;0.1071;0.3119;0.3333;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">游标 p 从头结点出发向后走</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p-&gt;next != NULL)   p = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3119;0.3333;0.3952;0.4167;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">p 停下来了：它后面是 NULL，它就是尾结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3952;0.4167;0.5143;0.5357;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">造出新结点 s（数据域填 e，next 先置 NULL）</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s = creatNode(e);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5143;0.5357;0.6929;0.7143;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">把尾结点的 next 指向 s —— 链表就延长了一节</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">p-&gt;next = s;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6929;0.7143;0.9786;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代价是每次都要从头走到尾：时间复杂度 O(n)</text></g></svg>