    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">07 · LocateElem —— 按值查找</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">逐个比对数据域，返回命中的结点</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="323" y1="110" x2="381" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 388 110 L 381 105.4 L 381 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="439" y1="110" x2="497" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 504 110 L 497 105.4 L 497 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="555" y1="110" x2="613" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 620 110 L 613 105.4 L 613 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="272" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="306" y1="96" x2="306" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="278" y1="134" x2="300" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="323" cy="119" r="3.6" fill="#3B82F6"/><text x="306" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="388" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="422" y1="96" x2="422" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="405" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="439" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="504" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="538" y1="96" x2="538" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="521" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="555" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="620" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="654" y1="96" x2="654" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="637" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="671" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1167;0.1310;0.2714;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="385" y="93" width="40" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2714;0.2857;0.9857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="501" y="93" width="40" height="52" rx="10" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0905;0.1071;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;116.0 0;116.0 0" keyTimes="0.0000;0.1071;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 422 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="422" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1143;0.1310;0.2690;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="306" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">10 != 20，继续往后</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2690;0.2857;0.5310;0.5476;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="422" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">20 == 20，命中！</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5310;0.5476;0.7929;0.8095;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">返回结点地址，而不是数据值</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7929;0.8095;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">找不到时 p 走到 NULL，直接返回 NULL</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0857;0.1071;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">按值查找：拿数据域挨个比，找到就返回那个结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0857;0.1071;0.2643;0.2857;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两个条件缺一不可：没走到尾、且当前值不等于目标</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p != NULL &amp;&amp; p-&gt;data != e)   p = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2643;0.2857;0.5262;0.5476;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一旦相等循环立刻停下，p 就停在第一个命中的结点上</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5262;0.5476;0.7881;0.8095;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">返回的是&quot;结点地址&quot;而不是&quot;值&quot;</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">return p;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7881;0.8095;0.9786;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">因为返回地址，调用者还能继续拿到它的前驱后继，而不只是一个数字</text></g></svg>