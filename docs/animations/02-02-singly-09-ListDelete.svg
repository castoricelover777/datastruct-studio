    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">09 · ListDelete —— 按位删除</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">定位前驱，摘掉结点再释放</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><line x1="265" y1="110" x2="323" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 330 110 L 323 105.4 L 323 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5935;0.6087;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><line x1="381" y1="110" x2="439" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 446 110 L 439 105.4 L 439 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.7348;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><line x1="497" y1="110" x2="555" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 562 110 L 555 105.4 L 555 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><line x1="613" y1="110" x2="671" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 678 110 L 671 105.4 L 671 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5935;0.6087;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><line x1="381" y1="110" x2="555" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="181 181" stroke-dashoffset="181"><animate attributeName="stroke-dashoffset" values="181;181;0;0;181" keyTimes="0;0.6065;0.6457;0.9996;1" dur="9.2s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 562 110 L 555 105.4 L 555 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><rect x="214" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="248" y1="96" x2="248" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="220" y1="134" x2="242" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="265" cy="119" r="3.6" fill="#3B82F6"/><text x="248" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><rect x="330" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="364" y1="96" x2="364" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="347" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="381" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3326;0.3478;0.7348;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><rect x="446" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="480" y1="96" x2="480" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="463" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text><circle cx="497" cy="119" r="3.6" fill="#3B82F6"/><text x="480" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">q</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><rect x="562" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="596" y1="96" x2="596" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="579" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="613" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><rect x="678" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="712" y1="96" x2="712" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="695" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="729" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5304;0.5435;0.7370;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><rect x="443" y="93" width="74" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1152;0.1304;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;116.0 0;116.0 0" keyTimes="0.0000;0.1304;0.3478;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><path d="M 248 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="248" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3326;0.3478;0.4630;0.4783;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">q = p-&gt;next  →  q 记住待删结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4630;0.4783;0.5935;0.6087;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">*e = q-&gt;data  （必须在 free 之前取出）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5935;0.6087;0.7348;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">p-&gt;next = q-&gt;next  →  绕过 q</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7348;0.7500;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">free(q)  结点还给系统</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1109;0.1304;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">删除第 i 个结点：单链表必须先找到它的前驱</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1109;0.1304;0.3283;0.3478;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">p 走到第 i-1 个结点 —— 因为只有前驱能改 next 把待删结点绕过去</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p-&gt;next != NULL &amp;&amp; j &lt; i - 1) { p = p-&gt;next; j++; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3283;0.3478;0.4587;0.4783;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用 q 记住待删结点</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">q = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4587;0.4783;0.5891;0.6087;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">先把数据取出来 —— 必须在 free 之前做</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">*e = q-&gt;data;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5891;0.6087;0.7304;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">摘链：前驱直接跨过 q，指向 q 的后继</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">p-&gt;next = q-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7304;0.7500;0.9804;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后释放 q，否则这块内存就泄漏了</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">free(q);</text></g></svg>