<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="printList —— 打印链表"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#3B82F6">
      <animate attributeName="width" values="0;888" dur="8.4s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">10 · printList —— 打印链表</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">走一遍，把每个数据打出来</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="323" y1="110" x2="381" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 388 110 L 381 105.4 L 381 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="439" y1="110" x2="497" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 504 110 L 497 105.4 L 497 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><line x1="555" y1="110" x2="613" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 620 110 L 613 105.4 L 613 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="272" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="306" y1="96" x2="306" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="278" y1="134" x2="300" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="323" cy="119" r="3.6" fill="#3B82F6"/><text x="306" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="388" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="422" y1="96" x2="422" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="405" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="439" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="504" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="538" y1="96" x2="538" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="521" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="555" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><rect x="620" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="654" y1="96" x2="654" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="637" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="671" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0786;0.0952;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;232.0 0;232.0 0" keyTimes="0.0000;0.0952;0.3214;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><path d="M 422 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="422" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1262;0.1429;0.2095;0.2262;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="272" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#1F2328">&gt; 10 -&gt;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2095;0.2262;0.2929;0.3095;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="272" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#1F2328">&gt; 10 -&gt; 20 -&gt;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2929;0.3095;0.3762;0.3929;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="272" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#1F2328">&gt; 10 -&gt; 20 -&gt; 30 -&gt;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3762;0.3929;0.9833;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="272" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="14" font-weight="400" fill="#1F2328">&gt; 10 -&gt; 20 -&gt; 30 -&gt; NULL</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0738;0.0952;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">遍历的固定套路：从第一个数据结点开始，一直走到 NULL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0738;0.0952;0.3000;0.3214;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">每访问一个结点，就打印它的数据域，然后指针后移</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p != NULL) { printf(&quot;%d -&gt; &quot;, p-&gt;data); p = p-&gt;next; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3214;0.5024;0.5238;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后打印一个 NULL 收尾，让人一眼看出链表到哪里结束</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">printf(&quot;NULL\n&quot;);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5024;0.5238;0.6929;0.7143;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">别忘了 p = p-&gt;next —— 漏了这句就是死循环</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6929;0.7143;0.9786;1.0000" dur="8.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">空表要单独处理，否则会解引用空指针</text></g></svg>