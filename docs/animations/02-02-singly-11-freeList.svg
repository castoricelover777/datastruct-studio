<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="freeList —— 释放整条链表"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#3B82F6">
      <animate attributeName="width" values="0;888" dur="9.6s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">11 · freeList —— 释放整条链表</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">逐个 free，最后把头结点也还回去</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2354;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="323" y1="110" x2="381" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 388 110 L 381 105.4 L 381 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3812;0.3958;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="439" y1="110" x2="497" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 504 110 L 497 105.4 L 497 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5479;0.5625;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="555" y1="110" x2="613" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 620 110 L 613 105.4 L 613 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.7563;0.7708;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="272" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="306" y1="96" x2="306" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="278" y1="134" x2="300" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="323" cy="119" r="3.6" fill="#3B82F6"/><text x="306" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2354;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="388" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="422" y1="96" x2="422" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="405" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="439" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4021;0.4167;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="504" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="538" y1="96" x2="538" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="521" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="555" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5687;0.5833;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="620" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="654" y1="96" x2="654" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="637" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="671" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7563;0.7708;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="272" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="306" y1="96" x2="306" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="289" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328"></text><circle cx="323" cy="119" r="3.6" fill="#3B82F6"/><text x="306" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L = NULL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1542;0.1667;0.2375;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="385" y="93" width="74" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3208;0.3333;0.4042;0.4167;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="501" y="93" width="74" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4875;0.5000;0.5708;0.5833;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="617" y="93" width="74" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6750;0.6875;0.7583;0.7708;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="269" y="93" width="74" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0688;0.0833;0.6313;0.6458;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;232.0 0;232.0 0" keyTimes="0.0000;0.0833;0.5000;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><path d="M 422 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="422" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0688;0.0833;0.6313;0.6458;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="248" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">q = p;  p = p-&gt;next;  free(q);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6313;0.6458;0.7771;0.7917;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="248" y="210" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">顺序固定：先记住 → 再后移 → 最后释放</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7771;0.7917;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#6E7781">释放完把 L 置 NULL —— 否则调用者手里是野指针</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0646;0.0833;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">链表是用 malloc 一个结点一个结点搭起来的，也必须逐个还回去</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0646;0.0833;0.2312;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">三步一组，顺序不能变</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">q = p;      /* 先记住当前 */
p = p-&gt;next; /* 再往后走 */
free(q);     /* 最后才释放 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2312;0.2500;0.6271;0.6458;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">如果先 free(p) 再去读 p-&gt;next，读到的就是垃圾值（use after free）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6271;0.6458;0.7729;0.7917;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">数据结点清完，头结点也要还回去</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">free(*L);   *L = NULL;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7729;0.7917;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后把调用者的指针置 NULL，避免它继续指向已释放的内存</text></g></svg>