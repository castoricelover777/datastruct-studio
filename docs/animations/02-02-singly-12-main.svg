    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">12 · main —— 把操作串起来跑一遍</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">一步一打印，让输出自己说明对错</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1632;0.1754;0.6193;0.6316;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><line x1="323" y1="110" x2="381" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="65 65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" values="65;65;0;0;65" keyTimes="0;0.1737;0.2053;0.9996;1" dur="11.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 388 110 L 381 105.4 L 381 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1982;0.2105;0.6895;0.7018;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><line x1="439" y1="110" x2="497" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="65 65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" values="65;65;0;0;65" keyTimes="0;0.2088;0.2404;0.9996;1" dur="11.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 504 110 L 497 105.4 L 497 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2333;0.2456;0.7596;0.7719;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><line x1="555" y1="110" x2="613" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="65 65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" values="65;65;0;0;65" keyTimes="0;0.2439;0.2754;0.9996;1" dur="11.4s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 620 110 L 613 105.4 L 613 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.8298;0.8421;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><rect x="272" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="306" y1="96" x2="306" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="278" y1="134" x2="300" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="323" cy="119" r="3.6" fill="#3B82F6"/><text x="306" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1632;0.1754;0.6193;0.6316;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0" keyTimes="0;0.1754;1" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><rect x="388" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="422" y1="96" x2="422" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="405" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="439" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1982;0.2105;0.6895;0.7018;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0" keyTimes="0;0.2105;1" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><rect x="504" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="