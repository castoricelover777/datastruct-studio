values="0;0;1;1;0;0" keyTimes="0.0000;0.8316;0.8421;0.8930;0.9035;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><rect x="269" y="93" width="74" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0930;0.1053;0.1632;0.1754;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#6E7781">&gt; (空表)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3035;0.3158;0.6193;0.6316;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#6E7781">&gt; 10 -&gt; 20 -&gt; 30 -&gt; NULL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6193;0.6316;0.8298;0.8421;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#EF4444">&gt; 逐个释放结点……</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8298;0.8421;0.9877;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">&gt; 释放完成，L = NULL</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0544;0.0702;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">main 的价值：把各个操作串成一条能跑通的流水线</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0544;0.0702;0.1596;0.1754;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 先初始化，打印确认是空表</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">InitList(&amp;L);   printList(L);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1596;0.1754;0.3000;0.3158;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 尾部依次追加 10、20、30</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">applist(L, 10);   applist(L, 20);   applist(L, 30);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3000;0.3158;0.6158;0.6316;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">③ 打印看看顺序对不对</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">printList(L);      /* 10 -&gt; 20 -&gt; 30 -&gt; NULL */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6158;0.6316;0.8263;0.8421;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">④ 释放整表 —— 每个 malloc 都要有对应的 free</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">freeList(&amp;L);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8263;0.8421;0.9842;1.0000" dur="11.4s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">关键是&quot;一步一打印&quot;：出错时一眼就能看出是从哪一步开始不对的</text></g></svg>