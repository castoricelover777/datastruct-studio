<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="EnQueue —— 入队"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">03-EnQueue · EnQueue —— 入队</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">先放数据，再让 rear 绕环前进一格</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">循环队列</text><rect x="301" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="330" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">0</text><rect x="361" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="390" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">1</text><rect x="421" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="450" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">2</text><rect x="481" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="510" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">3</text><rect x="541" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="570" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">4</text><rect x="601" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="630" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">5</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="301" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="330" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1060;0.1200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="361" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="390" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4460;0.4600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0" keyTimes="0;0.4600;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="421" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="450" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6460;0.6600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0" keyTimes="0;0.6600;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="481" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="510" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">40</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8260;0.8400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 14;0 0;0 0" keyTimes="0;0.8400;1" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="541" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="570" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">50</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 330 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="330" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">front</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4460;0.4600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 450 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="450" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">rear</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4460;0.4600;0.6460;0.6600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 510 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="510" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">rear</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6460;0.6600;0.8260;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 570 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="570" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">rear</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8260;0.8400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 630 100 l -6 -9 l 12 0 Z" fill="#EF4444"/><text x="630" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#EF4444">rear</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4460;0.4600;0.6460;0.6600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="200" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">① Q-&gt;data[Q-&gt;rear] = e;   先放进 rear 指着的空位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6460;0.6600;0.8260;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="200" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">② Q-&gt;rear = (Q-&gt;rear + 1) % MAXSIZE;   再让 rear 前进（到头绕回 0）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8260;0.8400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="200" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">rear 的下一格就是 front 了 → 判满，拒绝入队</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1820;0.2000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">队里已有 10、20，front = 0，rear = 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1820;0.2000;0.4420;0.4600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">入队一个元素，第一件事是判满</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if ((Q-&gt;rear + 1) % MAXSIZE == Q-&gt;front) return ERROR;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4420;0.4600;0.6420;0.6600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 放进 rear 指着的空位 —— 30 落到下标 2</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">Q-&gt;data[Q-&gt;rear] = e;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6420;0.6600;0.8220;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② rear 前进一格：2 → 3</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">Q-&gt;rear = (Q-&gt;rear + 1) % MAXSIZE;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8220;0.8400;0.9020;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一直入队到 rear = 5：这时 (5+1)%6 = 0 == front，判满</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9020;0.9200;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意顺序和栈**相反**：栈是&quot;先动指针再放值&quot;，队列是&quot;先放值再动指针&quot;</text></g></svg>