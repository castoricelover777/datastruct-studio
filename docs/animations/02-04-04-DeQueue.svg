rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="630" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">5</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3622;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="301" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="330" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5622;0.5778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="361" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="390" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="421" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="450" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="481" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="510" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">40</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3622;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 330 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="330" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">front</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3622;0.3778;0.5622;0.5778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 390 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="390" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">front</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5622;0.5778;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 450 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="450" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">front</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><path d="M 570 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="570" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">rear</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3622;0.3778;0.5622;0.5778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="200" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">&gt; 10                     ① 取走队头，front 前进一格</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5622;0.5778;0.7622;0.7778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="200" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">&gt; 10 20                  再出队一个</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7622;0.7778;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="200" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">出队不擦数据，只是把 front 往前挪 —— 空出的格子以后还能被 rear 绕回来用</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1133;0.1333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">队里是 10 20 30 40，front = 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1133;0.1333;0.3578;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">出队前先判空：front == rear 才是空队</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (Q-&gt;front == Q-&gt;rear) return ERROR;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3578;0.3778;0.5578;0.5778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 取走队头 10，front 前进一格</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">*e = Q-&gt;data[Q-&gt;front];   Q-&gt;front = (Q-&gt;front + 1) % MAXSIZE;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5578;0.5778;0.7578;0.7778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">再出队一个 —— 拿到 20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7578;0.7778;0.8689;0.8889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">10 和 20 还在数组里，但已经不属于这张队列了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8689;0.8889;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">空出来的下标 0、1 不会被浪费 —— 等 rear 绕一圈回来还能用</text></g></svg>