    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#10B981">
      <animate attributeName="width" values="0;888" dur="9s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-PostOrder · PostOrder —— 后序遍历</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">左 → 右 → 根：孩子都处理完才轮到自己</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#10B981">二叉树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="492.6087385681445" y1="97.60867049453599" x2="409.3912614318555" y2="146.39132950546403" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="521.3299855155723" y1="102.45584508722263" x2="554.6700144844277" y2="141.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="380.6700144844278" y1="170.45584508722263" x2="347.3299855155722" y2="209.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="405.3299855155722" y1="170.45584508722263" x2="438.6700144844278" y2="209.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="579.3299855155723" y1="170.45584508722263" x2="612.6700144844277" y2="209.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6289;0.6444;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="509" cy="88" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="509" y="93.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">A</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2956;0.3111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="393" cy="156" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="393" y="161.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5178;0.5333;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="567" cy="156" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="567" y="161.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">C</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0733;0.0889;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="335" cy="224" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="335" y="229.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">D</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1844;0.2000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="451" cy="224" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="451" y="229.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">E</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4067;0.4222;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="625" cy="224" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="625" y="229.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">F</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6289;0.6444;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">&gt; D E B F C A      （根跑到了最后）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0733;0.0889;0.3622;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">先左、再右、最后自己 —— 顺序不能反</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6289;0.6444;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">凡是&quot;必须等孩子处理完才能处理自己&quot;的事，都得用后序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6289;0.6444;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">释放整棵树就是典型：先 free 根，孩子就再也找不到了</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0689;0.0889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">后序：左 → 右 → 根</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0689;0.0889;0.1800;0.2000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">先递归左子树</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">PostOrder(T-&gt;left);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1800;0.2000;0.2911;0.3111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">再递归右子树</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">PostOrder(T-&gt;right);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2911;0.3111;0.4022;0.4222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">都处理完了，最后才打印自己</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">printf(&quot;%c &quot;, T-&gt;data);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4022;0.4222;0.6244;0.6444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">结果 D E B F C A —— 根跑到了最末尾</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6244;0.6444;0.7356;0.7556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">后序的独特价值：必须等孩子处理完的事，只能用它</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7356;0.7556;0.8689;0.8889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 释放整棵树 ② 算表达式树的值 ③ 求树高</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">/* 先 free 了根，就再也找不到孩子了 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8689;0.8889;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这三个的共同点：先递归拿到结果，再处理自己</text></g></svg>