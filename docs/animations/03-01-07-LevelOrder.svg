<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="LevelOrder —— 层序遍历"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#10B981">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">07-LevelOrder · LevelOrder —— 层序遍历</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">一层一层来，靠队列把下一层排好队</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#10B981">二叉树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;1.8055;1.8182" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="492.06468237165495" y1="92.61365293165827" x2="409.93531762834505" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;1.8055;1.8182" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="522.3197130335393" y1="97.54936325825548" x2="553.6802869664607" y2="129.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;1.8055;1.8182" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="379.6802869664607" y1="156.54936325825548" x2="348.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;1.8055;1.8182" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="406.3197130335393" y1="156.54936325825548" x2="437.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;1.8055;1.8182" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="580.3197130335393" y1="156.54936325825548" x2="611.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="509" cy="84" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="509" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">A</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1327;0.1455;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="393" cy="143" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="393" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2055;0.2182;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="567" cy="143" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="567" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">C</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3509;0.3636;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="335" cy="202" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="335" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">D</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4236;0.4364;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="451" cy="202" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="451" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">E</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4964;0.5091;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="625" cy="202" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="625" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">F</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2055;0.2182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">队列 [A] → 出 A 打印，入 B、C</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2055;0.2182;0.3509;0.3636;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">队列 [B C] → 出 B，入 D、E</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3509;0.3636;0.5691;0.5818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">队列 [C D E] → 出 C，入 F（C 没有左孩子）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5691;0.5818;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">&gt; A B C D E F      横向推进，一层一层</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0745;0.0909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">层序要横向推进，递归的纵向调用栈帮不上忙，得借一个队列</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0745;0.0909;0.1291;0.1455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 根入队</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">q[rear++] = T;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1291;0.1455;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 出队一个、打印、把两个孩子依次入队</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">BinTree cur = q[front++];
 printf(&quot;%c &quot;, cur-&gt;data);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.4200;0.4364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">入队顺序决定下一层的访问顺序 —— 必须先左后右</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (cur-&gt;left)  q[rear++] = cur-&gt;left;
 if (cur-&gt;right) q[rear++] = cur-&gt;right;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4200;0.4364;0.5655;0.5818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">循环到队空为止：A B C D E F</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5655;0.5818;0.7109;0.7273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这里用数组 + 两个下标直接当队列，不用额外依赖队列那一节的代码</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">BinTree q[64];   int front = 0, rear = 0;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7109;0.7273;0.8382;0.8545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">层序的用途：求树高、判断完全二叉树、按层打印</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8382;0.8545;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意：层序不是递归 —— 它是&quot;用队列模拟递归顺序&quot;的第一个例子</text></g></svg>