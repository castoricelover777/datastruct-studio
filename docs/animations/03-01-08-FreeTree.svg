<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="FreeTree —— 释放整棵树"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#10B981">
      <animate attributeName="width" values="0;888" dur="9s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">08-FreeTree · FreeTree —— 释放整棵树</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">后序释放：先孩子、后自己</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#10B981">二叉树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="492.6087385681445" y1="97.60867049453599" x2="409.3912614318555" y2="146.39132950546403" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="521.3299855155723" y1="102.45584508722263" x2="554.6700144844277" y2="141.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="380.6700144844278" y1="170.45584508722263" x2="347.3299855155722" y2="209.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="405.3299855155722" y1="170.45584508722263" x2="438.6700144844278" y2="209.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;2.2067;2.2222" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="579.3299855155723" y1="170.45584508722263" x2="612.6700144844277" y2="209.54415491277737" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.8956;0.9111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="509" cy="88" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="509" y="93.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">A</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4956;0.5111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="393" cy="156" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="393" y="161.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">B</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.7622;0.7778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="567" cy="156" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="567" y="161.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">C</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2289;0.2444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="335" cy="224" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="335" y="229.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">D</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3622;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="451" cy="224" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="451" y="229.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">E</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.6289;0.6444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="625" cy="224" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="625" y="229.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">F</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0511;0.0667;0.3622;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">先释放 D、E —— 两个叶子最先走</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3622;0.3778;0.6289;0.6444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">再释放 B：它的两个孩子已经清空了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6289;0.6444;0.8956;0.9111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">…… 最后才释放根 A</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8956;0.9111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">顺序反了会怎样？先 free 根，孩子就再也找不到了 —— 内存泄漏</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0467;0.0667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">释放整棵树，直觉上会想「从根开始 free」—— 但那样是错的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0467;0.0667;0.1578;0.1778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">先递归释放左子树</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">FreeTree(T-&gt;left);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1578;0.1778;0.2689;0.2889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">再递归释放右子树</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">FreeTree(T-&gt;right);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2689;0.2889;0.4244;0.4444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后才 free 自己 —— 这恰好就是后序</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">free(T);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4244;0.4444;0.6244;0.6444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看图上的顺序：D E B F C A，根永远最后走</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6244;0.6444;0.7800;0.8000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">为什么必须这样？因为 free 掉根之后，你就再也找不到它的孩子了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7800;0.8000;0.8911;0.9111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">凡是「必须等孩子处理完才能处理自己」的操作，都得用后序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8911;0.9111;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">同类的还有：算表达式树的值、统计树的高度</text></g></svg>