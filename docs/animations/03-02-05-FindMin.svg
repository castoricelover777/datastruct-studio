" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="406.27496160325245" y1="173.33077316561045" x2="379.72503839674755" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="437.72503839674755" y1="173.33077316561045" x2="464.27496160325245" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="696.2749616032525" y1="173.33077316561045" x2="669.7250383967475" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="84" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="538" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">8</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="306" cy="123.33333333333334" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="306" y="128.83333333333334" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="123.33333333333334" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="596" y="128.83333333333334" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="248" cy="162.66666666666669" r="19" fill="#E7F7F1" stroke="#10B981" stroke-width="2.4"/><text x="248" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="422" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="712" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="712" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">14</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="364" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="364" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="480" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="654" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="654" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">13</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1400;0.1556;0.5400;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="228" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">8 → 左孩子 3 → 左孩子 1 → 1 没有左孩子，停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5400;0.5556;0.8067;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="228" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">最小值 = 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8067;0.8222;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="228" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">最大值对称：一路往右到底就是 14</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1356;0.1556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最小值在哪？一定在&quot;最左边&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1356;0.1556;0.3133;0.3333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">因为左边都比根小 —— 只要还有左孩子，就一定能找到更小的</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (T-&gt;left != NULL) T = T-&gt;left;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3133;0.3333;0.4244;0.4444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">8 有左孩子 3，继续往左</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4244;0.4444;0.5356;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">3 有左孩子 1，继续往左</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5356;0.5556;0.6911;0.7111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">1 没有左孩子了 —— 它就是最小值</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6911;0.7111;0.8022;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用循环而不是递归：这里不需要回退，循环更直白</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8022;0.8222;0.9133;0.9333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最大值完全对称：一路往右走到没有右孩子为止</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (T-&gt;right != NULL) T = T-&gt;right;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9133;0.9333;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">下一节删除时要用它找&quot;替身&quot;，所以它不是可有可无的辅助函数</text></g></svg>