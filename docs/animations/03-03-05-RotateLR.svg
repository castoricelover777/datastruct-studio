<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="RotateLR —— 左右双旋"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#10B981">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-RotateLR · RotateLR —— 左右双旋</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">麻烦在「左孩子的右边」，得分两步走</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#10B981">AVL 树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="521.064682371655" y1="92.61365293165827" x2="438.93531762834505" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="435.3197130335393" y1="156.54936325825548" x2="466.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="84" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="538" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="555" y="68" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">失衡</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="143" r="19" fill="#FFF6E0" stroke="#D29922" stroke-width="2.4"/><text x="422" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="202" r="19" fill="#E7F7F1" stroke="#10B981" stroke-width="2.4"/><text x="480" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="497" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">麻烦在这</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0418;0.0545;0.3873;0.4000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">5 的左孩子是 3，3 的右孩子是 4 —— 麻烦藏在「内侧」</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3873;0.4000;0.6418;0.6545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">直接右单旋没用：会把那棵子树原样带过去，还是不平衡</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6418;0.6545;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">① 先对左孩子左旋 → 掰成 LL；② 再对自己右单旋</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0382;0.0545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">有些失衡单旋搞不定，比如 5 → 3 → 4 这种&quot;拐弯&quot;的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0382;0.0545;0.2018;0.2182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从 5 往下走：左（到 3）、再右（到 4）→ LR</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2018;0.2182;0.3836;0.4000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">直接右单旋会怎样？转完 3 当根，5 还是带着一棵高子树，依旧不平</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3836;0.4000;0.4927;0.5091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">问题是麻烦在&quot;左孩子的右边&quot;（内侧），一转就被原样带走</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4927;0.5091;0.6382;0.6545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以分两步：先把内侧的麻烦挪到外侧</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6382;0.6545;0.7655;0.7818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 对左孩子做左单旋，把 LR 掰成 LL</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">T-&gt;left = RotateRR(T-&gt;left);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7655;0.7818;0.8927;0.9091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 再对自己做右单旋（这一步就是 LL 的处理方式）</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">return RotateLL(T);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8927;0.9091;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">本质：双旋不是新的旋转类型，只是把两种情况拆成两次单旋</text></g></svg>