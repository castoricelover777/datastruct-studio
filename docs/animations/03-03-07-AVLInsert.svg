<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="AVLInsert —— 插入并自动平衡"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#10B981">
      <animate attributeName="width" values="0;888" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">07-AVLInsert · AVLInsert —— 插入并自动平衡</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">先按 BST 插进去，回溯时发现失衡就转</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#10B981">AVL 树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="463.06468237165495" y1="92.61365293165827" x2="380.93531762834505" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="496.93531762834505" y1="92.61365293165827" x2="579.064682371655" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="350.6802869664607" y1="156.54936325825548" x2="319.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="377.3197130335393" y1="156.54936325825548" x2="408.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="582.6802869664607" y1="156.54936325825548" x2="551.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="609.3197130335393" y1="156.54936325825548" x2="640.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="84" r="19" fill="#E7F7F1" stroke="#10B981" stroke-width="2.4"/><text x="480" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="497" y="68" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="364" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="364" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="381" y="127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="596" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text><text x="613" y="127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="306" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="306" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="323" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="422" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="439" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="538" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="555" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="654" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="654" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text><text x="671" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4883;0.5000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="232" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">插入 1 2 3 4 5 6 7 之后 —— 树高只有 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="232" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">普通 BST 按这个顺序插会得到高度 7 的一条链</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1050;0.1167;0.4883;0.5000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="232" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">插入四步：走下去 → 更新高度 → 算平衡因子 → 失衡就转</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1017;0.1167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">现在把旋转用起来：让树自己保持平衡</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1017;0.1167;0.2350;0.2500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">插入分四步，前两步和 BST 一样</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">T-&gt;left = AVLInsert(T-&gt;left, x);   /* 先按 BST 插进去 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2350;0.2500;0.3350;0.3500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第三步：回溯的路上更新自己的高度</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">UpdateHeight(T);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3350;0.3500;0.4850;0.5000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第四步：算平衡因子，绝对值到 2 就判断属于哪种情况并旋转</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">int bf = BalanceFactor(T);
 if (bf &gt; 1) { /* LL 或 LR */ }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4850;0.5000;0.6017;0.6167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">关键：插入只会让&quot;新结点到根&quot;这条路劲上的结点失衡</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6017;0.6167;0.7183;0.7333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">而且最先失衡的一定是离新结点最近的那个 —— 递归回溯天然从下往上</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7183;0.7333;0.8183;0.8333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以遇到的第一个失衡结点转一次就够了，不用继续往上修</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8183;0.8333;0.9017;0.9167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这就是 AVL 插入只要 O(log n) 的原因</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9017;0.9167;0.9850;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">判断哪种情况要看「左孩子的平衡因子」，不是&quot;新值比左孩子大还是小&quot;</text></g></svg>