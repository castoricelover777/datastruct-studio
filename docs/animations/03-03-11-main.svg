<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="main —— 让 AVL 自己找平衡"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#10B981">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">11-main · main —— 让 AVL 自己找平衡</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">故意用有序序列插入，看它怎么把自己掰回来</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#10B981">AVL 树</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="463.06468237165495" y1="92.61365293165827" x2="380.93531762834505" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="496.93531762834505" y1="92.61365293165827" x2="579.064682371655" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="350.6802869664607" y1="156.54936325825548" x2="319.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="377.3197130335393" y1="156.54936325825548" x2="408.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="582.6802869664607" y1="156.54936325825548" x2="551.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="609.3197130335393" y1="156.54936325825548" x2="640.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="84" r="19" fill="#E7F7F1" stroke="#10B981" stroke-width="2.4"/><text x="480" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="497" y="68" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">高 3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="364" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="364" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="596" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="306" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="306" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="422" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="538" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="654" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="654" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2964;0.3091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">插入 1 2 3 4 5 6 7（普通 BST 会退化成高度 7 的链）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2964;0.3091;0.6236;0.6364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">AVL 把它掰成了高度 3 的平衡树</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.6236;0.6364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">① 中序递增　② 每个结点都平衡 —— 两条都过</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0745;0.0909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用有序序列测 AVL 最能看出价值 —— 那正是普通 BST 的死穴</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0745;0.0909;0.2927;0.3091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">插入 1 2 3 4 5 6 7</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2927;0.3091;0.4018;0.4182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">如果不做平衡，会得到一条高度 7 的右斜链，查找退化成 O(n)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4018;0.4182;0.4927;0.5091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">AVL 每次插入后会检查平衡、必要时旋转</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4927;0.5091;0.6200;0.6364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后得到一棵高度只有 3 的平衡树（2³ − 1 = 7，正好装下 7 个结点）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6200;0.6364;0.7291;0.7455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">验证 ①：中序递增 → 还是 BST</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7291;0.7455;0.8382;0.8545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">验证 ②：每个结点平衡因子都在 -1..1 → 确实平衡</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8382;0.8545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">如果树高打出来是 7 而不是 3，说明旋转根本没生效，回去查 UpdateHeight 和判断条件</text></g></svg>