<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Insert —— 插入"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#0891B2">
      <animate attributeName="width" values="0;888" dur="9s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-Insert · Insert —— 插入</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">放末尾保住形状，再上浮恢复堆序</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#0891B2">堆</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="463.06468237165495" y1="92.61365293165827" x2="380.93531762834505" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="496.93531762834505" y1="92.61365293165827" x2="579.064682371655" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="350.6802869664607" y1="156.54936325825548" x2="319.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="377.3197130335393" y1="156.54936325825548" x2="408.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="582.6802869664607" y1="156.54936325825548" x2="551.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="609.3197130335393" y1="156.54936325825548" x2="640.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3178;0.3333;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="84" r="19" fill="#E7F7F1" stroke="#10B981" stroke-width="2.4"/><text x="480" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="364" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="364" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="596" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="306" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="306" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="422" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="538" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3178;0.3333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="654" cy="202" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="654" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0511;0.0667;0.6511;0.6667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="236" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">插入 0：先放数组末尾 → 再上浮</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6511;0.6667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="236" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">顺序固定：形状优先，再调顺序</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="236" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">删除正好相反：先调顺序，形状自然保持</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0467;0.0667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">插入就两步，顺序不能换</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0467;0.0667;0.2022;0.2222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 放到数组末尾 —— 这样完全二叉树的形状一定还是合法的</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">H-&gt;data[++H-&gt;size] = x;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2022;0.2222;0.3133;0.3333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 上浮到合适位置，恢复堆序</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">PercUp(H, H-&gt;size);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3133;0.3333;0.4911;0.5111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">0 比父亲小就换位，一路顶到根</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4911;0.5111;0.6467;0.6667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">如果先调顺序再考虑形状，就会顾此失彼 —— 所以顺序是固定的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6467;0.6667;0.8022;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">删除最小值正好相反：把末尾元素搬到根上（形状自然保持），再下沉调整顺序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8022;0.8222;0.9133;0.9333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">记住这一对：插入「先形状后顺序」，删除「先顺序形状自然保持」</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9133;0.9333;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两者都是 O(log n)，因为树的深度是 log n</text></g></svg>