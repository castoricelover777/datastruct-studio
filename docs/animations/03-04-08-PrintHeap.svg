  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">08-PrintHeap · PrintHeap / CheckHeap —— 打印与自查</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">数组顺序看不出堆序，得专门检查</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#0891B2">堆</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="492.06468237165495" y1="92.61365293165827" x2="409.93531762834505" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="525.935317628345" y1="92.61365293165827" x2="608.064682371655" y2="134.38634706834173" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="379.6802869664607" y1="156.54936325825548" x2="348.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="406.3197130335393" y1="156.54936325825548" x2="437.6802869664607" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="611.6802869664607" y1="156.54936325825548" x2="580.3197130335393" y2="188.45063674174452" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="509" cy="84" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="509" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="526" y="68" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="393" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="393" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="410" y="127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="625" cy="143" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="625" y="148.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="642" y="127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="335" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="335" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text><text x="352" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="451" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="451" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text><text x="468" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="567" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="567" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="584" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1575;0.1750;0.6075;0.6250;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">数组打印：1 3 2 6 7 5 —— 看不出堆序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6075;0.6250;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">CheckHeap：逐个结点检查「父 &lt;= 子」</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1525;0.1750;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">写完堆怎么自查？打印数组只能看到一串数字，看不出堆序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1525;0.1750;0.3525;0.3750;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">因为**数组顺序不代表任何大小关系** —— 堆只保证父子之间有序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3525;0.3750;0.6025;0.6250;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以要专门写一个检查：逐个结点看看是不是 &lt;= 它的孩子</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (H-&gt;data[i] &gt; H-&gt;data[i * 2]) return 0;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6025;0.6250;0.7275;0.7500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">左右孩子都要查，而且有右孩子时才比右孩子</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7275;0.7500;0.8525;0.8750;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">堆的 bug 往往不会崩，只是顺序悄悄错了 —— 比如下沉方向写反</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8525;0.8750;0.9775;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">CheckHeap 跑一遍就能把这类问题揪出来</text></g></svg>