<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="PrintHeap / CheckHeap —— 打印与自查"><rect width="960" height="300" fill="#FFFFFF"/><g>
