<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="GetWPL —— 带权路径长度"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-GetWPL · GetWPL —— 带权路径长度</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">每个叶子往上数层数，乘上权值加起来</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">哈夫曼树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="404.0062812748818" y1="90.1013184182872" x2="323.9937187251182" y2="117.23201491504614" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="440.7326822541869" y1="87.17594325573859" x2="635.2673177458131" y2="120.15739007759475" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="290.27496160325245" y1="133.9974398322771" x2="263.72503839674755" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="321.72503839674755" y1="133.9974398322771" x2="348.27496160325245" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="636.0062812748818" y1="129.43465175162055" x2="555.9937187251182" y2="156.56534824837948" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="669.7250383967475" y1="133.9974398322771" x2="696.2749616032525" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="522.2749616032525" y1="173.33077316561045" x2="495.72503839674755" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="553.7250383967475" y1="173.33077316561045" x2="580.2749616032525" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="84" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="422" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">19</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="306" cy="123.33333333333334" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="306" y="128.83333333333334" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">12</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="654" cy="123.33333333333334" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="654" y="128.83333333333334" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="248" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="248" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="265" y="146.66666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">2层 ×5=10</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="364" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="364" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text><text x="381" y="146.66666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">2层 ×7=14</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="538" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="712" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="712" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="729" y="146.66666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">2层 ×4=8</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="480" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="497" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">3层 ×1=3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="596" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="613" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" font-weight="600" fill="#6E7781">3层 ×2=6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3860;0.4000;0.9060;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">WPL = 5×2 + 7×2 + 4×2 + 1×3 + 2×3 = 41</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3860;0.4000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">WPL = Σ (叶子的权值 × 叶子的层数)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9060;0.9200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">权值大的放得浅、小的放得深 —— 这个值就是所有方案里最小的</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1220;0.1400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">怎么衡量一棵哈夫曼树&quot;好不好&quot;？用带权路径长度 WPL</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1220;0.1400;0.2820;0.3000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">WPL = Σ (叶子的权值 × 它到根的层数)</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">int GetWPL(...) { ... wpl += depth * HT[i].weight; ... }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2820;0.3000;0.3820;0.4000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">层数怎么数？从叶子顺着 parent 往上走，走一步加一层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3820;0.4000;0.4420;0.4600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这棵树：</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4420;0.4600;0.5620;0.5800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">权值 5、7、4 都在第 2 层 → 5×2 + 7×2 + 4×2 = 32</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5620;0.5800;0.6220;0.6400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">权值 1、2 在第 3 层 → 1×3 + 2×3 = 9</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6220;0.6400;0.7420;0.7600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">加起来 41。这就是这五个叶子的最小带权路径长度</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7420;0.7600;0.8620;0.8800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">换个组织方式试试：把 7 放到第 3 层，WPL 一定会变大</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8620;0.8800;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">哈夫曼算法的目标就是让这个值最小 —— 而它给出的解确实是最小的</text></g></svg>