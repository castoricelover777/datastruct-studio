    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="9s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-PrintCoding · PrintCoding —— 打印与自查</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">权值大的编码短，且互不为前缀</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">哈夫曼树</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="404.0062812748818" y1="90.1013184182872" x2="323.9937187251182" y2="117.23201491504614" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="440.7326822541869" y1="87.17594325573859" x2="635.2673177458131" y2="120.15739007759475" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="290.27496160325245" y1="133.9974398322771" x2="263.72503839674755" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="321.72503839674755" y1="133.9974398322771" x2="348.27496160325245" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="636.0062812748818" y1="129.43465175162055" x2="555.9937187251182" y2="156.56534824837948" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="669.7250383967475" y1="133.9974398322771" x2="696.2749616032525" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="522.2749616032525" y1="173.33077316561045" x2="495.72503839674755" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="553.7250383967475" y1="173.33077316561045" x2="580.2749616032525" y2="191.33589350105623" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="422" cy="84" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="422" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">19</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="306" cy="123.33333333333334" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="306" y="128.83333333333334" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">12</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="654" cy="123.33333333333334" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="654" y="128.83333333333334" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="248" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="248" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2067;0.2222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="364" cy="162.66666666666669" r="19" fill="#E7F7F1" stroke="#10B981" stroke-width="2.4"/><text x="364" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">7</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="538" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="538" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="712" cy="162.66666666666669" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="712" y="168.16666666666669" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5400;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="202" r="19" fill="#FDECEC" stroke="#EF4444" stroke-width="2.4"/><text x="480" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="202" r="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="596" y="207.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2067;0.2222;0.8067;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">权值 7 → 11　　权值 1 → 000</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8067;0.8222;0.8956;0.9111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">定长编码要 3 位（5 个字符至少 3 位），哈夫曼平均只要 2.2 位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8956;0.9111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">自查两件事：① 权值大编码短 ② 没有编码是别人的前缀</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2022;0.2222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">生成完编码，要检查两件事</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2022;0.2222;0.3133;0.3333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 权值和编码长度成反比 —— 权值大的编码短</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3133;0.3333;0.4467;0.4667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这是哈夫曼编码能压缩文件的原因：常用的字符用短码</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4467;0.4667;0.5356;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这里定长编码要 3 位（5 个字符至少 3 位才能区分开），哈夫曼平均只要 2.2 位</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5356;0.5556;0.6467;0.6667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 没有任何编码是另一个的前缀</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6467;0.6667;0.7133;0.7333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">为什么天然成立？因为所有叶子都在树的末端</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7133;0.7333;0.8467;0.8667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从根到叶子的路径不可能&quot;是到另一个叶子的路径的前缀&quot; —— 走到叶子就停了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8467;0.8667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这个性质叫<tspan font-weight="700">前缀码</tspan>，它保证解码不歧义：拿一串 0/1 从根走下去，撞到叶子就解出一个字符</text></g></svg>