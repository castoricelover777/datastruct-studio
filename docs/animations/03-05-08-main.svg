    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">08-main · main —— 把哈夫曼树跑一遍</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">权值是字符出现次数，编码就是压缩方案</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">哈夫曼树</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0660;0.0800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="404.0062812748818" y1="90.1013184182872" x2="323.9937187251182" y2="117.23201491504614" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0660;0.0800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="440.7326822541869" y1="87.17594325573859" x2="635.2673177458131" y2="120.15739007759475" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0660;0.0800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="290.27496160325245" y1="133.9974398322771" x2="263.72503839674755" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0660;0.0800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="321.72503839674755" y1="133.9974398322771" x2="348.27496160325245" y2="152.00256016772292" stroke="#D8DEE4" stroke-width="1.4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0660;0.0800;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="636.0062812748818" y1="129.43465175162055" x2="555.9937187251182" y2="156.565348248