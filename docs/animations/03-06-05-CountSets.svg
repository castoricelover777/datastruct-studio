<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="CountSets —— 数集合"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#0891B2">
      <animate attributeName="width" values="0;888" dur="8s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-CountSets · CountSets —— 数集合</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">数数组里有几个负数</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#0891B2">并查集</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="286.0483593845717" y1="165.69559569235685" x2="234.61600445425825" y2="223.55699498895947" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="313.9516406154283" y1="165.69559569235685" x2="365.38399554574175" y2="223.55699498895947" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2825;0.3000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><line x1="659.7765801434916" y1="157.06306433696128" x2="759.2816779449136" y2="192.60059926604058" stroke="#10B981" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="300" cy="150" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="300" y="155.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="220" cy="240" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="220" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="380" cy="240" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="380" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="640" cy="150" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="640" y="155.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2825;0.3000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><circle cx="780" cy="200" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="780" y="205.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1575;0.1750;0.7825;0.8000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">parent: -3 0 0 -2 3 → 两个负数 → 2 个集合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7825;0.8000;0.8825;0.9000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">只有根存负数，所以数负数的个数就是数集合的个数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8825;0.9000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">在图论里它就是「连通分量个数」</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1525;0.1750;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">怎么知道现在一共有几个集合？</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1525;0.1750;0.4275;0.4500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">因为只有根存负数，所以数负数的个数就行</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (S-&gt;parent[i] &lt; 0) count++;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4275;0.4500;0.5775;0.6000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">数组 -3 0 0 -2 3 里有两个负数 → 两个集合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5775;0.6000;0.6775;0.7000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">每次成功合并都会少一个集合，所以这个数是递减的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6775;0.7000;0.8025;0.8250;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">它在图论里有个更常见的名字：<tspan font-weight="700">无向图的连通分量个数</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8025;0.8250;0.9025;0.9250;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">n 个点、m 条边，把每条边两端的点并起来，剩下的集合数就是连通分量数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9025;0.9250;0.9775;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这也正是 Kruskal 最小生成树算法要做的事情</text></g></svg>