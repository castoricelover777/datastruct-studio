<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="CheckCycle —— 判断有没有环"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#0891B2">
      <animate attributeName="width" values="0;888" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-CheckCycle · CheckCycle —— 判断有没有环</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">两端已经连通，这条边就绕成了圈</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#0891B2">并查集</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1050;0.1167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="381" y1="84" x2="578" y2="84" stroke="#10B981" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.3217;0.3333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="584.7750118945173" y1="98.46373870020855" x2="495.9499875390771" y2="182.84751183787674" stroke="#10B981" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.6550;0.6667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="464.7750118945173" y1="183.53626129979145" x2="375.9499875390771" y2="99.15248816212325" stroke="#EF4444" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="360" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="360" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="600" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="600" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="198" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="480" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1050;0.1167;0.3217;0.3333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">加边 (0,1)：不同组 → 合并</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3217;0.3333;0.6550;0.6667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">加边 (1,2)：不同组 → 合并</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.6550;0.6667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">加边 (2,0)：2 和 0 **已经连通** → 这条边构成环！</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1017;0.1167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">并查集最经典的应用：判断无向图有没有环</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1017;0.1167;0.2017;0.2167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一条一条加边，每次看两端是不是已经连通</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2017;0.2167;0.3183;0.3333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">加 (0,1)：0 和 1 不同组，只是合并，没成环</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">r1 = Find(S, u);  r2 = Find(S, v);
 if (r1 == r2) return 1;   /* 成环 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3183;0.3333;0.4517;0.4667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">加 (1,2)：1 和 2 不同组，继续合并</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4517;0.4667;0.6517;0.6667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">现在 {0,1,2} 已经是一整块了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6517;0.6667;0.7683;0.7833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">加 (2,0)：2 和 0 已经连通 —— 说明之前就有一条路径连着它们</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7683;0.7833;0.8517;0.8667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">现在再加一条边，就绕成了一个圈</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8517;0.8667;0.9350;0.9500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">关键点：<tspan font-weight="700">处理到某条边时，前面所有边都已经并进并查集了</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.9350;0.9500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这个函数就是 Kruskal 最小生成树的核心 —— 不断加&quot;不成环&quot;的最短边</text></g></svg>