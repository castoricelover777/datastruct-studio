  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">08-main · main —— 把并查集跑一遍</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">合并、判断、数集合、判环</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#0891B2">并查集</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1327;0.1455;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="284.3908229288095" y1="144.04825936407144" x2="216.35247121743765" y2="205.2827759043061" stroke="#10B981" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1873;0.2000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="315.6091770711905" y1="144.04825936407144" x2="383.64752878256235" y2="205.2827759043061" stroke="#10B981" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4055;0.4182;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="658.7829710109983" y1="159.3914855054991" x2="760.3226017980019" y2="210.16130089900093" stroke="#10B981" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5873;0.6000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="320.9637618366749" y1="131.23316246098088" x2="618.0379637901501" y2="148.70811551706765" stroke="#D29922" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="300" cy="130" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="300" y="135.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1327;0.1455;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="200" cy="220" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="200" y="225.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1873;0.2000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="400" cy="220" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="400" y="225.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3509;0.3636;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="640" cy="150" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="640" y="155.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4055;0.4182;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="780" cy="220" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="780" y="225.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1327;0.1455;0.3509;0.3636;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">合并 (0,1) (0,2)：集合数从 6 降到 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4055;0.4182;0.5873;0.6000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">再合并 (3,4)：还剩 3 个集合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5873;0.6000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">把两块并起来：还剩 2 个集合</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0564;0.0727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">把并查集的几个操作串起来跑一遍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0564;0.0727;0.1291;0.1455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">初始 6 个元素，各自一组，集合数 = 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1291;0.1455;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">合并 0 和 1</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">Union(S, Find(S, 0), Find(S, 1));</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.4018;0.4182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328"><tspan font-weight="700">Union 的参数必须是根</tspan>，所以标准写法永远套一层 Find</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4018;0.4182;0.5109;0.5273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">合并 3 和 4，再合并 4 和 5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5109;0.5273;0.5836;0.6000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意每次合并都让集合数减一</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5836;0.6000;0.7109;0.7273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">把 {0,1,2} 和 {4,5} 并起来，还剩 2 个集合</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7109;0.7273;0.8200;0.8364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">查一次某个元素，数组会自动变得&quot;更扁&quot; —— 这就是路径压缩</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8200;0.8364;0.9109;0.9273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最后用它判断一个三角形有没有环</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9109;0.9273;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">到这里，树这一章就讲完了：从二叉树到 BST、AVL、堆、哈夫曼、并查集</text></g></svg>