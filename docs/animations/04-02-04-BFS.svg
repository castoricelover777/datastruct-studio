-size="11" fill="#6E7781">第1层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5217;0.5333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="265" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="265" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="265" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">第2层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5550;0.5667;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="415" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="415" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="415" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">第2层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5883;0.6000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="545" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="545" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="545" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">第2层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6217;0.6333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="695" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="695" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text><text x="695" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">第2层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2717;0.2833;0.5217;0.5333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">出队 0 → 邻居 1、2 都没去过 → 依次访问并入队</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5217;0.5333;0.7717;0.7833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">出队 1 → 访问 3、4；出队 2 → 访问 5、6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7717;0.7833;0.9217;0.9333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="13" font-weight="400" fill="#10B981">结果按层来：0 → 1 2 → 3 4 5 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9217;0.9333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">入队时就要立刻标记，不能拖到出队 —— 否则会重复入队</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0683;0.0833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">BFS：先把一圈邻居都看完，再往外扩一层</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0683;0.0833;0.2683;0.2833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从 0 出发：标记、打印、入队</text><text x="36" y="276" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">visited[v] = 1;  printf(...);  queue[rear++] = v;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2683;0.2833;0.3683;0.3833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">出队 0，把它的邻居 1、2 都访问掉并入队</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3683;0.3833;0.5183;0.5333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意此时队列里是 [1, 2] —— 同一层的点凑在一起了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5183;0.5333;0.6183;0.6333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">出队 1：访问它的邻居 3、4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6183;0.6333;0.7017;0.7167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">出队 2：访问它的邻居 5、6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7017;0.7167;0.7683;0.7833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">出队 3、4、5、6：它们都是叶子，没有新邻居</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7683;0.7833;0.8683;0.8833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">结果 0 1 2 3 4 5 6 —— 严格按层来的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8683;0.8833;0.9350;0.9500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一个容易写错的地方：<tspan font-weight="700">入队的时候就要立刻标记</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9350;0.9500;0.9850;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">如果等出队才标记，同一个点会被多个邻居重复入队 —— 小图上不明显，图一大就暴露</text></g></svg>