<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="main —— 两种遍历对着看"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-main · main —— 两种遍历对着看</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">同一张图，DFS 和 BFS 给出两个序列</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">图的遍历</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="461.76689401538636" y1="115.41891770549351" x2="359.1013491267381" y2="174.08494335614967" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="498.23310598461364" y1="115.41891770549351" x2="600.8986508732619" y2="174.08494335614967" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="324.64783936689975" y1="199.32868325756024" x2="281.0832159013431" y2="239.98899849207976" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="355.35216063310025" y1="199.32868325756024" x2="398.9167840986569" y2="239.98899849207976" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="604.6478393668998" y1="199.32868325756024" x2="561.0832159013431" y2="239.98899849207976" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="635.3521606331002" y1="199.32868325756024" x2="678.9167840986569" y2="239.98899849207976" stroke="#D8DEE4" stroke-width="1.8"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="480" cy="105" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="480" y="110.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="480" y="141" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">起点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="340" cy="185" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="340" y="190.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="620" cy="185" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="620" y="190.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="265" cy="255" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="265" y="260.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="415" cy="255" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="415" y="260.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="545" cy="255" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="545" y="260.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0600;0.0727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="695" cy="255" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="695" y="260.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.2727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="244" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">DFS：0 1 3 4 2 5 6      一条路走到黑</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4964;0.5091;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="244" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">BFS：0 1 2 3 4 5 6      按层扩散</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7509;0.7636;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="244" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">BFS 的&quot;按层&quot;性质，后面求最短路径会用到</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0564;0.0727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用一棵&quot;二叉树形状的图&quot;来看两种遍历的差别最清楚</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0564;0.0727;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从 0 出发，0 连着 1 和 2；1 连着 3、4；2 连着 5、6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.3655;0.3818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">DFS：沿着 0 → 1 → 3 一路钻下去，走完了才回头</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3655;0.3818;0.4927;0.5091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">再回头处理 4，然后才轮到 0 的另一个邻居 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4927;0.5091;0.6200;0.6364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">BFS：先把 0 的两个邻居 1、2 都看完</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6200;0.6364;0.7473;0.7636;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">再去看 1 的邻居 3、4 和 2 的邻居 5、6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7473;0.7636;0.8382;0.8545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">BFS 的输出严格按&quot;距离起点的层数&quot;排列</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8382;0.8545;0.9109;0.9273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这个性质后面很有用：**无权图里，BFS 第一次到达某点的路径就是最短路径**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9109;0.9273;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">下一节的最短路径（Dijkstra）就是在这个思想上加了权值</text></g></svg>