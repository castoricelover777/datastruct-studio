<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="PrintPath —— 还原路径"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">04-PrintPath · PrintPath —— 还原路径</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">顺着 path 倒着走，用递归把顺序翻正</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最短路径</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="351" y1="128" x2="628" y2="128" stroke="#10B981" stroke-width="3"/><text x="489.5" y="143" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2860;0.3000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="330" y1="149" x2="330" y2="218" stroke="#EF4444" stroke-width="3"/><text x="319" y="187.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#EF4444">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="650" y1="149" x2="650" y2="218" stroke="#10B981" stroke-width="3"/><text x="639" y="187.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2860;0.3000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="629" y1="240" x2="352" y2="240" stroke="#10B981" stroke-width="3"/><text x="490.5" y="233" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="330" cy="128" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="330" y="133.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="330" y="164" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">起点</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="650" cy="128" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="650" y="133.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="650" cy="240" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="650" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2860;0.3000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="330" cy="240" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="330" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="330" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">终点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1460;0.1600;0.8260;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">path[3]=2，path[2]=1，path[1]=0，path[0]=-1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8260;0.8400;0.9060;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">从 3 出发一路倒着找：3 → 2 → 1 → 0，走到 -1 就到起点了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9060;0.9200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="186" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">递归打印：先递归打前缀，再打自己 —— 顺序自然就翻正了</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1420;0.1600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">dist 给的是&quot;多远&quot;，path 给的是&quot;怎么走&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1420;0.1600;0.3420;0.3600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">path[w] = v 表示&quot;到 w 的最短路是从 v 过来的&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3420;0.3600;0.4220;0.4400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">想知道从源点到 3 的完整路线，就从 3 出发一路找 path：</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4220;0.4400;0.5820;0.6000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">3 → path[3]=2 → path[2]=1 → path[1]=0 → path[0]=-1 停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5820;0.6000;0.6820;0.7000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">结果是 3 2 1 0 —— **倒的**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6820;0.7000;0.8220;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用递归把它们翻正：先递归打印前面一段，再打印自己</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">PrintPath(path, path[v]);
 printf(&quot; -&gt; %d&quot;, v);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8220;0.8400;0.9020;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这和二叉树后序遍历是同一个套路：先处理更深的一层，再处理自己</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9020;0.9200;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">另一种写法是倒着走一遍收集到数组，再倒着打印 —— 效果一样但要多一个数组</text></g></svg>