<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="main —— 换个源点再跑一次"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-main · main —— 换个源点再跑一次</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">同一张图，不同起点的结果完全不同</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最短路径</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="351" y1="128" x2="628" y2="128" stroke="#D8DEE4" stroke-width="1.8"/><text x="489.5" y="143" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="330" y1="149" x2="330" y2="218" stroke="#D8DEE4" stroke-width="1.8"/><text x="319" y="187.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1460;0.1600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="650" y1="149" x2="650" y2="218" stroke="#10B981" stroke-width="3"/><text x="639" y="187.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1460;0.1600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="629" y1="240" x2="352" y2="240" stroke="#10B981" stroke-width="3"/><text x="490.5" y="233" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="330" cy="128" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="330" y="133.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="330" y="164" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">dist 4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="650" cy="128" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="650" y="133.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="650" y="164" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">dist 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1460;0.1600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="650" cy="240" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="650" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="650" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">新源点</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="330" cy="240" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="330" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="330" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">dist 1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4860;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">从 0 出发：到 1=2，到 2=3，到 3=4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4860;0.5000;0.9060;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">从 2 出发：到 1=1，到 3=1，到 0=4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9060;0.9200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">Dijkstra 求的是&quot;单源&quot;最短路 —— 换起点要重跑一遍</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1820;0.2000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从 0 出发跑一遍，结果：到 1=2、到 2=3、到 3=4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1820;0.2000;0.3420;0.3600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">特别记住 3 的答案：直连是 5，绕 0→1→2→3 只要 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3420;0.3600;0.4820;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这就是&quot;松弛&quot;要反复做的原因 —— 第一眼看到的 dist 只是&quot;目前已知&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4820;0.5000;0.6020;0.6200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">换个源点从 2 出发，结果完全变了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6020;0.6200;0.7420;0.7600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">到 1 是 1（直连）、到 3 是 1（直连）、到 0 要绕 2→3→0 = 1+5 = 6？</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7420;0.7600;0.8220;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">不对 —— 应该走 2→1→0 = 1+2 = 3。程序会算出正确答案</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8220;0.8400;0.9020;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Dijkstra 求的是<tspan font-weight="700">单源</tspan>最短路径：换起点就得重跑一遍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9020;0.9200;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">想求&quot;任意两点之间&quot;的距离，要么每个点都跑一遍（O(n³)），要么用 Floyd（也是 O(n³)）</text></g></svg>