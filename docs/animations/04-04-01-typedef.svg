    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">01-typedef · typedef —— 两种表示都留着</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">Prim 用矩阵，Kruskal 用边表</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最小生成树</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="261" y1="118" x2="638" y2="118" stroke="#D8DEE4" stroke-width="1.8"/><text x="449.5" y="133" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="240" y1="139" x2="240" y2="216" stroke="#D8DEE4" stroke-width="1.8"/><text x="229" y="181.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="260.21267370341104" y1="123.69629895277947" x2="438.82481802499797" y2="174.0324487161358" stroke="#D8DEE4" stroke-width="1.8"/><text x="346.5349702222724" y="163.45196482195865" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="639.9416961503365" y1="124.2180741933957" x2="481.01346117583796" y2="173.48582703549022" stroke="#D8DEE4" stroke-width="1.8"/><text x="557.2204921808324" y="142.34522002652398" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="666.5425640526045" y1="137.95482036044345" x2="693.145885278224" y2="219.09495009858304" stroke="#D8DEE4" stroke-width="1.8"/><text x="669.3916997147057" y="185.95194259040127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="260.3061720377494" y1="232.64655464459335" x2="438.72686738902445" y2="185.60837132471173" stroke="#D8DEE4" stroke-width="1.8"/><text x="352.32070537574276" y="223.76402929014031" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="480.372992503052" y1="185.09324812576298" x2="678.6568649968027" y2="234.66421624920068" stroke="#D8DEE4" stroke-width="1.8"/><text x="576.8470368745277" y="224.55029968908048" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="460" y1="201" x2="460" y2="246" stroke="#D8DEE4" stroke-width="1.8"/><text x="449" y="227.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="679.1414740791679" y1="242.43349469076375" x2="481.8517890599193" y2="265.4506246096761" stroke="#D8DEE4" stroke-width="1.8"/><text x="579.2219438743816" y="247.01616512026024" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="240" cy="118" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="240" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="240" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">源点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="660" cy="118" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="660" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="240" cy="238" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="240" y="243.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="460" cy="180" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="460" y="185.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="700" cy="240" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="700" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0511;0.0667;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="460" cy="268" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="460" y="273.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1400;0.1556;0.5844;0.6000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="244" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">Prim 要频繁问&quot;谁离树最近&quot; → 邻接矩阵方便</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5844;0.6000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="244" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">Kruskal 要排序边、还要判环 → 边表方便</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7844;0.8000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="244" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">先想清楚算法要反复做什么，再决定用什么存</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1356;0.1556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最小生成树：选 n-1 条边把所有点连起来，让总权值最小</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1356;0.1556;0.2689;0.2889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">为什么结果一定是一棵树？因为成环就说明有冗余边，去掉它会更小</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2689;0.2889;0.3578;0.3778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两种经典算法，贪的东西不一样</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3578;0.3778;0.4911;0.5111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**Prim 加点法**：每次把&quot;离当前树最近的顶点&quot;加进来</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4911;0.5111;0.5800;0.6000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**Kruskal 加边法**：把边排序，每次加&quot;不成环的最短边&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5800;0.6000;0.7133;0.7333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Prim 要频繁问&quot;谁离树最近&quot; —— 用邻接矩阵方便</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7133;0.7333;0.7800;0.8000;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Kruskal 要排序边、还要判断成不成环 —— 用边表方便</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7800;0.8000;0.8911;0.9111;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以这一节两种表示都留着，这不是凑数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8911;0.9111;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**先想清楚算法要反复做什么，再决定用什么存**</text></g></svg>