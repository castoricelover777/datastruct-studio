<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Prim —— 加点法"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="13s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">02-Prim · Prim —— 加点法</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">每轮把离树最近的顶点加进来</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最小生成树</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="271" y1="84" x2="648" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><text x="459.5" y="99" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="250" y1="105" x2="250" y2="153" stroke="#10B981" stroke-width="3"/><text x="239" y="133" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="270.53657887633005" y1="88.38736003267051" x2="448.48548879622564" y2="126.40371806101184" stroke="#D8DEE4" stroke-width="1.8"/><text x="357.2128928667838" y="122.15279464872835" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="649.5568997277617" y1="88.80412856397601" x2="491.416581237583" y2="125.967103409168" stroke="#10B981" stroke-width="3"/><text x="567.9702921872563" y="100.67732536778051" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="678.2973333696982" y1="103.29130008454828" x2="701.307555517459" y2="156.79006657809225" stroke="#10B981" stroke-width="3"/><text x="679.6974777326249" y="138.38690557259076" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="270.5921941895093" y1="170.88156116209814" x2="448.42722513479976" y2="135.31455497304006" stroke="#10B981" stroke-width="3"/><text x="361.66698714867454" y="167.88444550016922" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="490.62458325046777" y1="134.95304512300632" x2="688.3932937376052" y2="172.858714633041" stroke="#D8DEE4" stroke-width="1.8"/><text x="587.438295810557" y="168.70923300922107" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="470" y1="152" x2="470" y2="176" stroke="#10B981" stroke-width="3"/><text x="459" y="168" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="689.0799319325816" y1="178.8305059558991" x2="491.91626178491447" y2="196.08232709381997" stroke="#D8DEE4" stroke-width="1.8"/><text x="589.5392604056581" y="180.49828563240231" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="250" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="250" y="120" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">in</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="670" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="670" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="670" y="120" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d5 →</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="175" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="250" y="180.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="250" y="211" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d1 ✓</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="131" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="470" y="136.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="470" y="167" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d2 ✓</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="177" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="710" y="182.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="710" y="213" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d3 待定</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="470" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="470" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d4 ✓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1123;0.1231;0.3738;0.3846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">第1轮：加 2（边 0-2 权 1）→ 用 2 更新：2-3 权 2 比 5 短</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3738;0.3846;0.6354;0.6462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">第2轮：加 3（d=2）→ 用 3 更新：到 5 是 4、到 4 是 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6354;0.6462;0.8354;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">第3、4轮：加 5（d=4）、加 1（d=5）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8354;0.8462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">总权值 = 1 + 2 + 4 + 5 + 3 = 15</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1092;0.1231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Prim：从任意一点出发，每次把&quot;离当前树最近的顶点&quot;加进来</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1092;0.1231;0.2169;0.2308;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">初始 dist = [0, 6, 1, 5, INF, INF] —— 只有源点和它的直连邻居有值</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2169;0.2308;0.2938;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 1 轮：未入树里 dist 最小的是 2（dist=1），加进来，总权值 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2938;0.3077;0.3708;0.3846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用 2 更新别人：2-3 权 2 比原来的 5 更短 → dist[3] 改成 2</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (visited[w] == 0 &amp;&amp; G-&gt;g[v][w] &lt; dist[w]) dist[w] = G-&gt;g[v][w];</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3708;0.3846;0.4631;0.4769;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 2 轮：最小的是 3（dist=2），加进来，总权值 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4631;0.4769;0.5400;0.5538;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用 3 更新：到 5 是 4，到 4 是 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5400;0.5538;0.6323;0.6462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 3 轮：最小的是 5（dist=4），总权值 7</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6323;0.6462;0.7092;0.7231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 4 轮：最小的是 4？（dist=3，因为 1-4 权 3）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7092;0.7231;0.7862;0.8000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">等等 —— 4 还没入树，但它的 dist 是 3，比 1 的 5 小，所以先加 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7862;0.8000;0.8323;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 5 轮：最后加 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8323;0.8462;0.9092;0.9231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">总共选了 5 条边（n-1），总权值 15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9092;0.9231;0.9862;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**关键差别**：Prim 的 dist[w] 是&quot;w 到树的一条边&quot;，不是&quot;从源点过来的路程&quot;</text></g></svg>