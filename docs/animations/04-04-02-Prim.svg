<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Prim —— 加点法"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="13s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">02-Prim · Prim —— 加点法</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">每轮把离树最近的顶点加进来</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最小生成树</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="261" y1="118" x2="638" y2="118" stroke="#D8DEE4" stroke-width="1.8"/><text x="449.5" y="133" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="240" y1="139" x2="240" y2="216" stroke="#10B981" stroke-width="3"/><text x="229" y="181.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="260.21267370341104" y1="123.69629895277947" x2="438.82481802499797" y2="174.0324487161358" stroke="#D8DEE4" stroke-width="1.8"/><text x="346.5349702222724" y="163.45196482195865" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="639.9416961503365" y1="124.2180741933957" x2="481.01346117583796" y2="173.48582703549022" stroke="#10B981" stroke-width="3"/><text x="557.2204921808324" y="142.34522002652398" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="666.5425640526045" y1="137.95482036044345" x2="693.145885278224" y2="219.09495009858304" stroke="#10B981" stroke-width="3"/><text x="669.3916997147057" y="185.95194259040127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="260.3061720377494" y1="232.64655464459335" x2="438.72686738902445" y2="185.60837132471173" stroke="#10B981" stroke-width="3"/><text x="352.32070537574276" y="223.76402929014031" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="480.372992503052" y1="185.09324812576298" x2="678.6568649968027" y2="234.66421624920068" stroke="#D8DEE4" stroke-width="1.8"/><text x="576.8470368745277" y="224.55029968908048" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="460" y1="201" x2="460" y2="246" stroke="#10B981" stroke-width="3"/><text x="449" y="227.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="679.1414740791679" y1="242.43349469076375" x2="481.8517890599193" y2="265.4506246096761" stroke="#D8DEE4" stroke-width="1.8"/><text x="579.2219438743816" y="247.01616512026024" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="240" cy="118" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="240" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="240" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">in</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="660" cy="118" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="660" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="660" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d5 →</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="240" cy="238" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="240" y="243.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="240" y="274" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d1 ✓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="460" cy="180" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="460" y="185.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="460" y="216" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d2 ✓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="700" cy="240" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="700" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="700" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d3 待定</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="460" cy="268" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="460" y="273.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><text x="460" y="304" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">d4 ✓</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1123;0.1231;0.3738;0.3846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">第1轮：加 2（边 0-2 权 1）→ 用 2 更新：2-3 权 2 比 5 短</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3738;0.3846;0.6354;0.6462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">第2轮：加 3（d=2）→ 用 3 更新：到 5 是 4、到 4 是 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6354;0.6462;0.8354;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">第3、4轮：加 5（d=4）、加 1（d=5）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8354;0.8462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">总权值 = 1 + 2 + 4 + 5 + 3 = 15</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1092;0.1231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Prim：从任意一点出发，每次把&quot;离当前树最近的顶点&quot;加进来</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1092;0.1231;0.2169;0.2308;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">初始 dist = [0, 6, 1, 5, INF, INF] —— 只有源点和它的直连邻居有值</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2169;0.2308;0.2938;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 1 轮：未入树里 dist 最小的是 2（dist=1），加进来，总权值 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2938;0.3077;0.3708;0.3846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用 2 更新别人：2-3 权 2 比原来的 5 更短 → dist[3] 改成 2</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (visited[w] == 0 &amp;&amp; G-&gt;g[v][w] &lt; dist[w]) dist[w] = G-&gt;g[v][w];</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3708;0.3846;0.4631;0.4769;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 2 轮：最小的是 3（dist=2），加进来，总权值 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4631;0.4769;0.5400;0.5538;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用 3 更新：到 5 是 4，到 4 是 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5400;0.5538;0.6323;0.6462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 3 轮：最小的是 5（dist=4），总权值 7</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6323;0.6462;0.7092;0.7231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 4 轮：最小的是 4？（dist=3，因为 1-4 权 3）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7092;0.7231;0.7862;0.8000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">等等 —— 4 还没入树，但它的 dist 是 3，比 1 的 5 小，所以先加 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7862;0.8000;0.8323;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第 5 轮：最后加 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8323;0.8462;0.9092;0.9231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">总共选了 5 条边（n-1），总权值 15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9092;0.9231;0.9862;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**关键差别**：Prim 的 dist[w] 是&quot;w 到树的一条边&quot;，不是&quot;从源点过来的路程&quot;</text></g></svg>