<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="FindRoot —— 并查集判环"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">03-FindRoot · FindRoot —— 并查集判环</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">Kruskal 靠它判断&quot;加了会不会成环&quot;</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最小生成树</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="271" y1="84" x2="648" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><text x="459.5" y="99" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1460;0.1600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="250" y1="105" x2="250" y2="153" stroke="#10B981" stroke-width="3"/><text x="239" y="133" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="270.53657887633005" y1="88.38736003267051" x2="448.48548879622564" y2="126.40371806101184" stroke="#D8DEE4" stroke-width="1.8"/><text x="357.2128928667838" y="122.15279464872835" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="649.5568997277617" y1="88.80412856397601" x2="491.416581237583" y2="125.967103409168" stroke="#D8DEE4" stroke-width="1.8"/><text x="567.9702921872563" y="100.67732536778051" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4460;0.4600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="678.2973333696982" y1="103.29130008454828" x2="701.307555517459" y2="156.79006657809225" stroke="#10B981" stroke-width="3"/><text x="679.6974777326249" y="138.38690557259076" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2460;0.2600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="270.5921941895093" y1="170.88156116209814" x2="448.42722513479976" y2="135.31455497304006" stroke="#10B981" stroke-width="3"/><text x="361.66698714867454" y="167.88444550016922" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="490.62458325046777" y1="134.95304512300632" x2="688.3932937376052" y2="172.858714633041" stroke="#D8DEE4" stroke-width="1.8"/><text x="587.438295810557" y="168.70923300922107" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="470" y1="152" x2="470" y2="176" stroke="#D8DEE4" stroke-width="1.8"/><text x="459" y="168" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="689.0799319325816" y1="178.8305059558991" x2="491.91626178491447" y2="196.08232709381997" stroke="#D8DEE4" stroke-width="1.8"/><text x="589.5392604056581" y="180.49828563240231" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="84" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="250" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="250" y="120" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">根</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4260;0.4400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="670" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="670" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1460;0.1600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="175" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="250" y="180.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2460;0.2600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="131" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="470" y="136.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4260;0.4400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="177" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="710" y="182.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="198" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="470" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1460;0.1600;0.5260;0.5400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#3B82F6">parent[0]=-1 表示 0 是根；parent[2]=0 表示 2 的父亲是 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5260;0.5400;0.8260;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">一条边 (u,v) 会成环 ⟺ u 和 v 的根相同</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8260;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">而&quot;判断两点是否连通&quot;正是并查集的看家本领</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1420;0.1600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Kruskal 要反复问一句话：加这条边会不会成环？</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1420;0.1600;0.2420;0.2600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一条边 (u, v) 成环，等价于 u 和 v <tspan font-weight="700">已经连通</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2420;0.2600;0.4220;0.4400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">比如已经把 0-2 和 2-3 加进去了，现在 {0,2,3} 是一整块</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4220;0.4400;0.5220;0.5400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这时再想加 0-3：0 和 3 的根都是 0 → 已经连通 → 会成环，跳过</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5220;0.5400;0.6620;0.6800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">而 1 和 4 的根分别是它们自己 → 不连通 → 可以加</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6620;0.6800;0.7620;0.7800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">&quot;判断两点是否连通&quot;正是并查集的看家本领（03-06 讲过）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7620;0.7800;0.8220;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以 Kruskal = 边排序 + 并查集，两个老朋友拼在一起</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8220;0.8400;0.9020;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这里的并查集是简化版：只保留路径压缩，不做按大小合并</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.9020;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">（parent 用 -1 表示根，比 03-06 的&quot;负数存大小&quot;更好读，但功能少一些）</text></g></svg>