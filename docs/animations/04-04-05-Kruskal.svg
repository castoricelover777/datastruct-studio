<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Kruskal —— 加边法"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="13s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-Kruskal · Kruskal —— 加边法</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">从小到大试每条边，不成环就加</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最小生成树</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="261" y1="118" x2="638" y2="118" stroke="#D8DEE4" stroke-width="1.8"/><text x="449.5" y="133" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="240" y1="139" x2="240" y2="216" stroke="#10B981" stroke-width="3"/><text x="229" y="181.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0354;0.0462;0.4046;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="260.21267370341104" y1="123.69629895277947" x2="438.82481802499797" y2="174.0324487161358" stroke="#EF4444" stroke-width="3"/><text x="346.5349702222724" y="163.45196482195865" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#EF4444">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4046;0.4154;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="639.9416961503365" y1="124.2180741933957" x2="481.01346117583796" y2="173.48582703549022" stroke="#10B981" stroke-width="3"/><text x="557.2204921808324" y="142.34522002652398" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1738;0.1846;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="666.5425640526045" y1="137.95482036044345" x2="693.145885278224" y2="219.09495009858304" stroke="#10B981" stroke-width="3"/><text x="669.3916997147057" y="185.95194259040127" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0969;0.1077;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="260.3061720377494" y1="232.64655464459335" x2="438.72686738902445" y2="185.60837132471173" stroke="#10B981" stroke-width="3"/><text x="352.32070537574276" y="223.76402929014031" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="480.372992503052" y1="185.09324812576298" x2="678.6568649968027" y2="234.66421624920068" stroke="#D8DEE4" stroke-width="1.8"/><text x="576.8470368745277" y="224.55029968908048" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2508;0.2615;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="460" y1="201" x2="460" y2="246" stroke="#10B981" stroke-width="3"/><text x="449" y="227.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="679.1414740791679" y1="242.43349469076375" x2="481.8517890599193" y2="265.4506246096761" stroke="#D8DEE4" stroke-width="1.8"/><text x="579.2219438743816" y="247.01616512026024" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="240" cy="118" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="240" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="660" cy="118" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="660" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="240" cy="238" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="240" y="243.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="460" cy="180" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="460" y="185.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="700" cy="240" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="700" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0354;0.0462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="460" cy="268" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="460" y="273.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0354;0.0462;0.4046;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">① 加 0-2(1)  ② 加 2-3(2)  ③ 加 1-4(3)  ④ 加 3-5(4)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4046;0.4154;0.6046;0.6154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#EF4444">⑤ 试 0-3(5)：0 和 3 已经连通 → 会成环 → 跳过</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6046;0.6154;0.8354;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">⑥ 加 1-3(5)：把两块并起来 → 加够 5 条，停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8354;0.8462;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="250" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">总权值 = 1+2+3+4+5 = 15（和 Prim 一样）</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0938;0.1077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">边排好序之后，依次去试</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0938;0.1077;0.1708;0.1846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 加 0-2（权 1）：0 和 2 不连通 → 加，总权值 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1708;0.1846;0.2477;0.2615;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 加 2-3（权 2）：不连通 → 加，总权值 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2477;0.2615;0.3246;0.3385;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">③ 加 1-4（权 3）：不连通 → 加，总权值 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3246;0.3385;0.4015;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">④ 加 3-5（权 4）：不连通 → 加，总权值 10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4015;0.4154;0.5092;0.5231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">⑤ 试 0-3（权 5）：0 和 3 的根都是 0 → **已经连通，会成环 → 跳过**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5092;0.5231;0.6015;0.6154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这一步是算法的精髓：跳过它不会损失最优性，因为绕过它总有别的路连通</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6015;0.6154;0.7092;0.7231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">⑥ 试 1-3（权 5）：1 在 {1,4}，3 在 {0,2,3,5} → 不连通 → 加</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7092;0.7231;0.8323;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">加进去之后两块连成一体，总共 5 条边 = n-1 → 停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8323;0.8462;0.9092;0.9231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">总权值 = 1+2+3+4+5 = 15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9092;0.9231;0.9862;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**注意选出的边和 Prim 不完全一样**（Prim 用的是 3-1、Kruskal 是 1-3），但总权值相同</text></g></svg>