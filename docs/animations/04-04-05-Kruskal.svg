<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Kruskal —— 加边法"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="13s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-Kruskal · Kruskal —— 加边法</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">从小到大试每条边，不成环就加</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">最小生成树</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="271" y1="84" x2="648" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><text x="459.5" y="99" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="250" y1="105" x2="250" y2="153" stroke="#10B981" stroke-width="3"/><text x="239" y="133" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4046;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="270.53657887633005" y1="88.38736003267051" x2="448.48548879622564" y2="126.40371806101184" stroke="#EF4444" stroke-width="3"/><text x="357.2128928667838" y="122.15279464872835" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#EF4444">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4046;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="649.5568997277617" y1="88.80412856397601" x2="491.416581237583" y2="125.967103409168" stroke="#10B981" stroke-width="3"/><text x="567.9702921872563" y="100.67732536778051" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1738;0.1846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="678.2973333696982" y1="103.29130008454828" x2="701.307555517459" y2="156.79006657809225" stroke="#10B981" stroke-width="3"/><text x="679.6974777326249" y="138.38690557259076" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0969;0.1077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="270.5921941895093" y1="170.88156116209814" x2="448.42722513479976" y2="135.31455497304006" stroke="#10B981" stroke-width="3"/><text x="361.66698714867454" y="167.88444550016922" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="490.62458325046777" y1="134.95304512300632" x2="688.3932937376052" y2="172.858714633041" stroke="#D8DEE4" stroke-width="1.8"/><text x="587.438295810557" y="168.70923300922107" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2508;0.2615;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="470" y1="152" x2="470" y2="176" stroke="#10B981" stroke-width="3"/><text x="459" y="168" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="689.0799319325816" y1="178.8305059558991" x2="491.91626178491447" y2="196.08232709381997" stroke="#D8DEE4" stroke-width="1.8"/><text x="589.5392604056581" y="180.49828563240231" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="250" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="670" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="670" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="175" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="250" y="180.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="131" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="470" y="136.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="177" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="710" y="182.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="470" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4046;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">① 加 0-2(1)  ② 加 2-3(2)  ③ 加 1-4(3)  ④ 加 3-5(4)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4046;0.4154;0.6046;0.6154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#EF4444">⑤ 试 0-3(5)：0 和 3 已经连通 → 会成环 → 跳过</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6046;0.6154;0.8354;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">⑥ 加 1-3(5)：把两块并起来 → 加够 5 条，停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8354;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">总权值 = 1+2+3+4+5 = 15（和 Prim 一样）</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0938;0.1077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">边排好序之后，依次去试</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0938;0.1077;0.1708;0.1846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 加 0-2（权 1）：0 和 2 不连通 → 加，总权值 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1708;0.1846;0.2477;0.2615;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 加 2-3（权 2）：不连通 → 加，总权值 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2477;0.2615;0.3246;0.3385;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">③ 加 1-4（权 3）：不连通 → 加，总权值 6</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3246;0.3385;0.4015;0.4154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">④ 加 3-5（权 4）：不连通 → 加，总权值 10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4015;0.4154;0.5092;0.5231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">⑤ 试 0-3（权 5）：0 和 3 的根都是 0 → <tspan font-weight="700">已经连通，会成环 → 跳过</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5092;0.5231;0.6015;0.6154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这一步是算法的精髓：跳过它不会损失最优性，因为绕过它总有别的路连通</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6015;0.6154;0.7092;0.7231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">⑥ 试 1-3（权 5）：1 在 {1,4}，3 在 {0,2,3,5} → 不连通 → 加</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7092;0.7231;0.8323;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">加进去之后两块连成一体，总共 5 条边 = n-1 → 停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8323;0.8462;0.9092;0.9231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">总权值 = 1+2+3+4+5 = 15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.9092;0.9231;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328"><tspan font-weight="700">注意选出的边和 Prim 不完全一样</tspan>（Prim 用的是 3-1、Kruskal 是 1-3），但总权值相同</text></g></svg>