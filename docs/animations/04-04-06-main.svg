nt="indefinite" calcMode="linear"/><line x1="470" y1="152" x2="470" y2="176" stroke="#10B981" stroke-width="3"/><text x="459" y="168" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#10B981">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="689.0799319325816" y1="178.8305059558991" x2="491.91626178491447" y2="196.08232709381997" stroke="#D8DEE4" stroke-width="1.8"/><text x="589.5392604056581" y="180.49828563240231" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" font-weight="600" fill="#6E7781">6</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="84" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="250" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="670" cy="84" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="670" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="250" cy="175" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="250" y="180.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="131" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="470" y="136.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="177" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="710" y="182.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="470" cy="198" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="470" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.2727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">Prim = 15，Kruskal = 15 → 一致，说明都对</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">看&quot;点&quot;贪心 → Prim，适合稠密图 O(n²)</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">看&quot;边&quot;贪心 → Kruskal，适合稀疏图 O(e log e)</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1109;0.1273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">同一张图，两种算法各跑一遍</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1109;0.1273;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Prim 从 0 出发加点，选出 5 条边</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.3473;0.3636;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Kruskal 排序加边，也选出 5 条边</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3473;0.3636;0.4382;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两者的总权值都是 15 —— **必须一样**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4382;0.4545;0.5473;0.5636;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">为什么用两个算法互相验证？因为它们思路完全不同</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5473;0.5636;0.6200;0.6364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">只看一个结果，错了也不知道；两条路都走通，可信度高得多</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6200;0.6364;0.6745;0.6909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">（最大子列和那节也用过这招 —— 四种算法互相对账）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6745;0.6909;0.7836;0.8000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">选哪个？看&quot;点&quot;贪心的 Prim 适合稠密图，O(n²)，不依赖边数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7836;0.8000;0.8745;0.8909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看&quot;边&quot;贪心的 Kruskal 适合稀疏图，O(e log e)，只和边数有关</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8745;0.8909;0.9291;0.9455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">和邻接矩阵 / 邻接表的选择是一个道理：**看图的稠密程度**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9291;0.9455;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">下一节最后一站：拓扑排序 —— 它解决的是&quot;谁必须先做&quot;这类顺序问题</text></g></svg>