<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="typedef —— AOV 网与入度"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">01-typedef · typedef —— AOV 网与入度</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">入度 = 有多少个任务必须排在我前面</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">拓扑排序</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="291" y1="118" x2="472" y2="118" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 478 118 L 469 122.5 L 469 113.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="270" y1="139" x2="270" y2="212" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 270 218 L 265.5 209 L 274.5 209 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="291" y1="240" x2="472" y2="240" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 478 240 L 469 244.5 L 469 235.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="520.1920029004573" y1="123.76914368584494" x2="683.077329466057" y2="170.3078084188734" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 688.8464731519019 171.95613518625768 L 678.9565125475963 173.81050279956497 L 681.4290026986728 165.15678727079757 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="520.1405560747173" y1="234.0537405874644" x2="683.1459252337103" y2="185.92834588338079" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 688.9003698264867 184.22941462265632 L 681.5429013828655 191.09364495832526 L 678.9945044917788 182.46197806916072 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="118" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="270" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="270" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">入度 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="240" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="270" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="270" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">入度 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="118" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="500" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="500" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">入度 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="240" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="500" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="500" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">入度 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="178" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="710" y="183.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="710" y="214" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">入度 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1260;0.1400;0.4860;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">有向边 A→B 表示「A 必须在 B 之前」</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4860;0.5000;0.7860;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">入度为 0 的顶点没有前置任务 —— 现在就能做</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7860;0.8000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">矩阵不对称（有向图只填一个格子）</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1220;0.1400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">拓扑排序解决的问题：一堆任务有先后依赖，怎么排出一个合法顺序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1220;0.1400;0.2420;0.2600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用图表示：**顶点是任务，有向边 A→B 表示 A 必须在 B 之前**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2420;0.2600;0.4020;0.4200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这样的有向图叫 AOV 网（Activity On Vertex）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4020;0.4200;0.4820;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">入度 = 有多少条边指向我 = **有多少任务必须排在我前面**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4820;0.5000;0.6020;0.6200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以入度为 0 的顶点没有前置任务，随时可以做</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6020;0.6200;0.7220;0.7400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看这张图：0 的入度是 0（谁都不等），4 的入度是 2（要等 2 和 3）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7220;0.7400;0.7820;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">存储上，有向图比无向图只少填一个格子 —— 但矩阵从此**不对称**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7820;0.8000;0.8820;0.9000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">如果打印出来发现对称了，说明建图时写成了无向图</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8820;0.9000;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">顺便说一句出度：入度是&quot;我要等谁&quot;，出度是&quot;谁要等我&quot;</text></g></svg>