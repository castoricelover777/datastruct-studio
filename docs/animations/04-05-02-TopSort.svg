<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="TopSort —— Kahn 算法"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="14s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">02-TopSort · TopSort —— Kahn 算法</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">每次挑入度 0 的输出，然后删掉它的出边</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">拓扑排序</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0614;0.0714;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><line x1="291" y1="118" x2="472" y2="118" stroke="#10B981" stroke-width="3"/><path d="M 478 118 L 469 122.5 L 469 113.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1614;0.1714;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><line x1="270" y1="139" x2="270" y2="212" stroke="#10B981" stroke-width="3"/><path d="M 270 218 L 265.5 209 L 274.5 209 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3186;0.3286;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><line x1="291" y1="240" x2="472" y2="240" stroke="#10B981" stroke-width="3"/><path d="M 478 240 L 469 244.5 L 469 235.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4757;0.4857;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><line x1="520.1920029004573" y1="123.76914368584494" x2="683.077329466057" y2="170.3078084188734" stroke="#10B981" stroke-width="3"/><path d="M 688.8464731519019 171.95613518625768 L 678.9565125475963 173.81050279956497 L 681.4290026986728 165.15678727079757 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6329;0.6429;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><line x1="520.1405560747173" y1="234.0537405874644" x2="683.1459252337103" y2="185.92834588338079" stroke="#10B981" stroke-width="3"/><path d="M 688.9003698264867 184.22941462265632 L 681.5429013828655 191.09364495832526 L 678.9945044917788 182.46197806916072 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0614;0.0714;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="118" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="270" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="270" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">①id0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0329;0.0429;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="240" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="270" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="270" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">③id0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0329;0.0429;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="118" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="500" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="500" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">②id0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0329;0.0429;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="240" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="500" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="500" y="276" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">④id0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0329;0.0429;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="178" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="710" y="183.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="710" y="214" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">⑤id0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0614;0.0714;0.2471;0.2571;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">初始只有 0 入度为 0 → 输出 0，删掉它的出边</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2471;0.2571;0.4329;0.4429;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">2 和 1 的入度降成 0 → 入队</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4329;0.4429;0.7757;0.7857;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="400" fill="#10B981">依次输出 2、1、3，最后 4 的入度也降到 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7757;0.7857;0.9900;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">结果：0 2 1 3 4    （每条边都从前往后）</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0586;0.0714;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Kahn 算法的思路非常自然：入度为 0 的任务，随时可以做</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0586;0.0714;0.1586;0.1714;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">先把所有入度 0 的顶点放进队列 —— 这里只有 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1586;0.1714;0.2014;0.2143;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">取出 0，输出它</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2014;0.2143;0.2443;0.2571;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">然后**把它的出边都删掉**：到 2 和到 1 的边没了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2443;0.2571;0.3300;0.3429;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">等价于让邻居的入度减一。2 的入度 1→0，1 的入度 1→0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3300;0.3429;0.4300;0.4429;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">&quot;删边&quot;用入度减一来表示，不用真的改矩阵</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">if (--indegree[i] == 0) queue[rear++] = i;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4300;0.4429;0.5157;0.5286;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">它们入度归零了，进队。队列现在是 [2, 1]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5157;0.5286;0.6300;0.6429;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">取出 2，输出。它的出边到 4 —— 4 的入度从 2 降到 1，还不是 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6300;0.6429;0.7157;0.7286;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">取出 1，输出。到 3 的边删掉 → 3 入度归零，进队</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7157;0.7286;0.7729;0.7857;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">取出 3，输出。到 4 的边删掉 → 4 入度归零，进队</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7729;0.7857;0.8443;0.8571;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">取出 4，输出。它没有出边。队列空，结束</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8443;0.8571;0.9157;0.9286;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">结果 0 2 1 3 4 —— 每条边都是从前往后的，合法</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9157;0.9286;0.9871;1.0000" dur="14s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意：队列里有多个入度 0 的点时，先输出谁都可以 —— 拓扑序不唯一</text></g></svg>