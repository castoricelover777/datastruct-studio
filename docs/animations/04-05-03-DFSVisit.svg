<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="DFSVisit —— 深度优先的后序"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">03-DFSVisit · DFSVisit —— 深度优先的后序</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">回溯时才把自己填进去</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">拓扑排序</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="281" y1="84" x2="462" y2="84" stroke="#10B981" stroke-width="3"/><path d="M 468 84 L 459 88.5 L 459 79.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="260" y1="105" x2="260" y2="170" stroke="#10B981" stroke-width="3"/><path d="M 260 176 L 255.5 167 L 264.5 167 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5460;0.5600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="281" y1="198" x2="462" y2="198" stroke="#10B981" stroke-width="3"/><path d="M 468 198 L 459 202.5 L 459 193.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="510.2909337316262" y1="89.41091566176698" x2="672.945421691165" y2="132.7854457843107" stroke="#10B981" stroke-width="3"/><path d="M 678.7428313287726 134.33142168767267 L 668.8872349448399 136.3605150608353 L 671.2061987998828 127.66440060442407 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="510.24213988697284" y1="192.40931374550274" x2="673.010480150703" y2="147.45424833932967" stroke="#10B981" stroke-width="3"/><path d="M 678.793948689838 145.8569094094733 L 671.3167500785277 152.59051920860915 L 668.9207416837431 143.91531639990652 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="260" cy="84" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="260" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="260" y="120" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">最后填</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="260" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="260" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4060;0.4200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="490" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="490" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5460;0.5600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="490" cy="198" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="490" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="700" cy="140" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="700" y="145.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="700" y="176" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">最先填</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5460;0.5600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">DFS 先一路钻到底，走不通了才回头</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5460;0.5600;0.8860;0.9000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">关键在最后一行：**邻居都处理完了，才把自己填进数组**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8860;0.9000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">而且是从数组**尾部往前**填 —— 这就是逆后序</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0420;0.0600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">下一个做法用深度优先，代码比 Kahn 还短</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0420;0.0600;0.2220;0.2400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从 0 出发，先递归到 1，再递归到 3，再递归到 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2220;0.2400;0.4020;0.4200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">同时记住：DFS 先走邻居，所以**邻居一定先回溯完**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4020;0.4200;0.5420;0.5600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看顺序：4 最先回溯完，然后是 3，再是 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5420;0.5600;0.6620;0.6800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以把自己填进数组的时机是&quot;**在递归完所有邻居之后**&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6620;0.6800;0.7820;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代码就一行，放在循环之后</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">DFSVisit(G, i, visited, order, pos);... order[(*pos)--] = v;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7820;0.8000;0.8820;0.9000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这一行和普通 DFS 的唯一区别就是位置 —— 放在循环之后就是后序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8820;0.9000;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">而且是从数组**最后往前**填的（逆后序），下一个模块就能看出为什么</text></g></svg>