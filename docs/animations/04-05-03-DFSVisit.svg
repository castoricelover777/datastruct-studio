<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="DFSVisit —— 深度优先的后序"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">03-DFSVisit · DFSVisit —— 深度优先的后序</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">回溯时才把自己填进去</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">拓扑排序</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="291" y1="118" x2="472" y2="118" stroke="#10B981" stroke-width="3"/><path d="M 478 118 L 469 122.5 L 469 113.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="270" y1="139" x2="270" y2="212" stroke="#10B981" stroke-width="3"/><path d="M 270 218 L 265.5 209 L 274.5 209 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5460;0.5600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="291" y1="240" x2="472" y2="240" stroke="#10B981" stroke-width="3"/><path d="M 478 240 L 469 244.5 L 469 235.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="520.1920029004573" y1="123.76914368584494" x2="683.077329466057" y2="170.3078084188734" stroke="#10B981" stroke-width="3"/><path d="M 688.8464731519019 171.95613518625768 L 678.9565125475963 173.81050279956497 L 681.4290026986728 165.15678727079757 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="520.1405560747173" y1="234.0537405874644" x2="683.1459252337103" y2="185.92834588338079" stroke="#10B981" stroke-width="3"/><path d="M 688.9003698264867 184.22941462265632 L 681.5429013828655 191.09364495832526 L 678.9945044917788 182.46197806916072 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0460;0.0600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="118" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="270" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="270" y="154" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">最后填</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="240" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="270" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4060;0.4200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="118" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="500" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5460;0.5600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="240" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="500" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6860;0.7000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="710" cy="178" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="710" y="183.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="710" y="214" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">最先填</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0460;0.0600;0.5460;0.5600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">DFS 先一路钻到底，走不通了才回头</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5460;0.5600;0.8860;0.9000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">关键在最后一行：**邻居都处理完了，才把自己填进数组**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8860;0.9000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="262" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">而且是从数组**尾部往前**填 —— 这就是逆后序</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0420;0.0600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">下一个做法用深度优先，代码比 Kahn 还短</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0420;0.0600;0.2220;0.2400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">从 0 出发，先递归到 1，再递归到 3，再递归到 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2220;0.2400;0.4020;0.4200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">同时记住：DFS 先走邻居，所以**邻居一定先回溯完**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4020;0.4200;0.5420;0.5600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看顺序：4 最先回溯完，然后是 3，再是 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5420;0.5600;0.6620;0.6800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以把自己填进数组的时机是&quot;**在递归完所有邻居之后**&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6620;0.6800;0.7820;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代码就一行，放在循环之后</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">DFSVisit(G, i, visited, order, pos);... order[(*pos)--] = v;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7820;0.8000;0.8820;0.9000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这一行和普通 DFS 的唯一区别就是位置 —— 放在循环之后就是后序</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8820;0.9000;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">而且是从数组**最后往前**填的（逆后序），下一个模块就能看出为什么</text></g></svg>