<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="TopSortDFS —— 逆后序就是拓扑序"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">04-TopSortDFS · TopSortDFS —— 逆后序就是拓扑序</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">有边 A→B，那 A 一定比 B 晚回溯完</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">拓扑排序</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1217;0.1333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="281" y1="84" x2="462" y2="84" stroke="#10B981" stroke-width="3"/><path d="M 468 84 L 459 88.5 L 459 79.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1217;0.1333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="260" y1="105" x2="260" y2="170" stroke="#10B981" stroke-width="3"/><path d="M 260 176 L 255.5 167 L 264.5 167 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1217;0.1333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="281" y1="198" x2="462" y2="198" stroke="#10B981" stroke-width="3"/><path d="M 468 198 L 459 202.5 L 459 193.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1217;0.1333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="510.2909337316262" y1="89.41091566176698" x2="672.945421691165" y2="132.7854457843107" stroke="#10B981" stroke-width="3"/><path d="M 678.7428313287726 134.33142168767267 L 668.8872349448399 136.3605150608353 L 671.2061987998828 127.66440060442407 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1217;0.1333;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><line x1="510.24213988697284" y1="192.40931374550274" x2="673.010480150703" y2="147.45424833932967" stroke="#10B981" stroke-width="3"/><path d="M 678.793948689838 145.8569094094733 L 671.3167500785277 152.59051920860915 L 668.9207416837431 143.91531639990652 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="260" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="260" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text><text x="260" y="120" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">最早</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="260" cy="198" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="260" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text><text x="260" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">②</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="490" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="490" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text><text x="490" y="120" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">⑤最晚</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="490" cy="198" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="490" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text><text x="490" y="234" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">③</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><circle cx="700" cy="140" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="700" y="145.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text><text x="700" y="176" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11" fill="#6E7781">④</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1217;0.1333;0.4883;0.5000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">有边 A→B 时，DFS 会先递归到 B，B 先回溯完</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4883;0.5000;0.7383;0.7500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">所以 B 的后序位置更靠前、A 更靠后</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7383;0.7500;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">把位置**反过来用**，A 就排在 B 前面了 —— 正是我们要的</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1183;0.1333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">为什么&quot;逆后序&quot;一定是拓扑序？关键在于这一句推理</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1183;0.1333;0.2183;0.2333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">假设有一条边 A → B</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2183;0.2333;0.3183;0.3333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">DFS 从 A 出发时，会<tspan font-weight="700">先递归到 B</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3183;0.3333;0.4850;0.5000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">因为 B 在递归更深处，它会<tspan font-weight="700">先回溯完、先拿到后序位置</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4850;0.5000;0.5850;0.6000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">也就是说：<tspan font-weight="700">A 的后序位置比 B 更靠后</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5850;0.6000;0.6850;0.7000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">那我们反过来用这个位置 —— 谁后序靠后就放前面</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6850;0.7000;0.7350;0.7500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">得到的结果里，A 就排在 B 前面了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7350;0.7500;0.8183;0.8333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这正是&quot;A 必须在 B 之前&quot;，也就是拓扑序的定义</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8183;0.8333;0.9017;0.9167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以在代码里，只需要<tspan font-weight="700">从数组最后往前填</tspan>就行</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9017;0.9167;0.9850;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意 DFS 版<tspan font-weight="700">不能直接用来检测环</tspan> —— 它照样会输出一个序列，只是有环时那个序列没意义</text></g></svg>