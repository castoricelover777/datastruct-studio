<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="main —— 有环会怎样"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05-main · main —— 有环会怎样</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">环上的顶点入度永远降不到 0</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">拓扑排序</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.2727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="270" y1="139" x2="270" y2="212" stroke="#EF4444" stroke-width="3"/><path d="M 270 218 L 265.5 209 L 274.5 209 Z" fill="#EF4444"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.2727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="288.55169236872723" y1="230.15953709137077" x2="475.2644101750303" y2="131.12061721150565" stroke="#EF4444" stroke-width="3"/><path d="M 480.5648937089524 128.30905638046872 L 474.722839031347 136.50176027746565 L 470.5054977847916 128.55103497658254 Z" fill="#EF4444"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.2727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="479" y1="118" x2="298" y2="118" stroke="#EF4444" stroke-width="3"/><path d="M 292 118 L 301 113.5 L 301 122.5 Z" fill="#EF4444"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="118" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="270" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="270" cy="240" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="270" y="245.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="500" cy="118" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="500" y="123.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.2727;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="268" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">0→1→2→0 的环：每个点的入度都是 1，谁也降不到 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="268" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">一个都进不了队 → 队列一直空 → 输出 0 个</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="268" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">所以：输出顶点数 &lt; n ⟺ 有环</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2600;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="268" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">两个算法算出的序列不一样，但都合法 —— 拓扑排序不唯一</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0382;0.0545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">正常的 AOV 网跑完之后，顺便看点别的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0382;0.0545;0.1473;0.1636;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Kahn 和 DFS 逆后序给出的序列不一样，但都合法 —— 拓扑排序不唯一</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1473;0.1636;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">验证合法性只要检查：每条边的起点是不是都排在终点前面</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.3655;0.3818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">现在换一个有环的图：0→1→2→0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3655;0.3818;0.5291;0.5455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">每个顶点的入度都是 1 —— 也就是&quot;每个任务都要等另一个&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5291;0.5455;0.6382;0.6545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">入度为 0 的顶点一个都没有 → 队列从一开始就是空的</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6382;0.6545;0.7109;0.7273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以一个顶点也输出不了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7109;0.7273;0.8200;0.8364;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">于是得到一个漂亮的判据：**输出的顶点数 &lt; n，就说明图里有环**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8200;0.8364;0.9109;0.9273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这就顺手解决了&quot;判断有向图有没有环&quot;这个问题</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9109;0.9273;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">到这里 04 图这一章就讲完了 —— 下一章进入排序</text></g></svg>