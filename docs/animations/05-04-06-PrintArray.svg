<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="PrintArray —— 两种读法"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#0891B2">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-PrintArray · PrintArray —— 两种读法</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">表排序之后，直接看是乱的、按表看是有序的</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#0891B2">排序</text><rect x="361" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="390" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">0</text><rect x="421" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="450" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">1</text><rect x="481" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="510" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">2</text><rect x="541" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="570" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">3</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="361" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="390" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="421" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="450" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="481" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="510" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">40</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="541" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="570" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3860;0.4000;0.6460;0.6600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 450 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="450" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">table[0]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6460;0.6600;0.7860;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 570 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="570" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">table[1]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7860;0.8000;0.9260;0.9400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 390 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="390" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">table[2]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9260;0.9400;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><path d="M 510 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="510" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">table[3]</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1260;0.1400;0.4860;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">IsSorted(A) 直接看数组 → 假（数组本身乱着）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5260;0.5400;0.9060;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">IsSortedByTable(A, table) → 真（按 table 读才有意义）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9060;0.9200;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">两个函数都要有 —— 不然会误判&quot;表排序根本没排&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1220;0.1400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">表排序有个特殊的输出方式，要特别说明</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1220;0.1400;0.2820;0.3000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">排完之后 A = [30, 10, 40, 20]，直接看它<tspan font-weight="700">是乱的</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2820;0.3000;0.3820;0.4000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">但 table = [1, 3, 0, 2]，按这个顺序读就是 10、20、30、40</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3820;0.4000;0.4820;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以需要两个检查函数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4820;0.5000;0.5220;0.5400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① IsSorted(A) —— 直接看数组（表排序后会返回&quot;假&quot;）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5220;0.5400;0.7220;0.7400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② IsSortedByTable(A, table) —— 绕一层 table 看（返回&quot;真&quot;）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7220;0.7400;0.8220;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两个都要写，不然调试时会误判&quot;表排序根本没生效&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8220;0.8400;0.9220;0.9400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">后来要物理有序的话，再调 Rearrange 做环移动</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9220;0.9400;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这也是表排序使用上的一个&quot;心智负担&quot;：要记住&quot;有序&quot;是指按表有序</text></g></svg>