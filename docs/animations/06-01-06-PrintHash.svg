ame="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6978;0.7111;10.9867;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="208" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7422;0.7556;10.9867;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="328" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7867;0.8000;10.9867;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="448" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8311;0.8444;10.9867;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="568" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8756;0.8889;10.9867;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="688" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="151" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="180" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">100</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1844;0.2000;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="211" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="240" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">200</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="271" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="300" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2511;0.2667;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="331" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="360" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">300</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="391" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="420" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3178;0.3333;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="451" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="480" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">400</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="511" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="540" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3844;0.4000;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="571" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="600" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">500</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="631" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="660" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4511;0.4667;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="691" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="720" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">600</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><rect x="751" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="780" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5400;0.5556;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">每格最多一个元素、还有一半格子空着 → 分布不错</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6511;0.6667;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">装填因子 = 已用格数 / 表长。它越高，冲突越多</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8289;0.8444;10.9844;11.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">一般建议控制在 0.5 ~ 0.75，超过就该扩容</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1356;0.1556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">怎么判断&quot;散列函数好不好&quot;？看各个格子被用到的次数是否均匀</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1356;0.1556;0.3133;0.3333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">好的散列函数：每个格子被用到的次数差不多</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3133;0.3333;0.5356;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">差的散列函数：有的格子挤爆、有的永远空着</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5356;0.5556;0.6467;0.6667;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这里 6 个元素散到了 6 个不同格子，没有一个冲突</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6467;0.6667;0.7578;0.7778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">另一个定量指标是**装填因子**：已用格数 / 表长</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7578;0.7778;0.8244;0.8444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">它越高，冲突的概率越大 —— 因为空位变少了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8244;0.8444;0.9133;0.9333;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">实践中一般控制在 0.5 ~ 0.75 之间</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9133;0.9333;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">超过这个范围就该扩容（rehash）了</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">扩容的代价不小：要把所有元素重新散列一遍</text></g></svg>