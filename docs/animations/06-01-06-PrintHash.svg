  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-PrintHash · PrintHash —— 看分布均匀不均匀</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">好的散列函数让每格差不多满</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">散列</text><rect x="151" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">0</text><rect x="211" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="240" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">1</text><rect x="271" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="300" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">2</text><rect x="331" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="360" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">3</text><rect x="391" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="420" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">4</text><rect x="451" y="104" width="58" height="46" rx="6" f