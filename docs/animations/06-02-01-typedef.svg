="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="360" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="391" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="420" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="451" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="480" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="511" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="540" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="571" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="600" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="631" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="660" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2260;0.2400;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="691" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="720" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><rect x="751" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="780" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2260;0.2400;0.4860;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">20 散列到 9 号格，空着 → 放进去</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4860;0.5000;0.7860;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">31 也散列到 9 → 被占了 → 试 10 号格（探测）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7860;0.8000;9.8860;9.9000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">42 又散列到 9、10 都占 → 试 0 号格（绕回表头）</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0820;0.1000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">上一节留下一个问题：冲突了怎么办？</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0820;0.1000;0.2220;0.2400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">开放地址法的回答：<tspan font-weight="700">在表里另找一个空位</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2220;0.2400;0.3220;0.3400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">20 散列到 9 号格，空着 → 直接放进去</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3220;0.3400;0.4820;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这个&quot;试下一个&quot;的规则叫<tspan font-weight="700">探测序列</tspan>，它决定算法的全部性质</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4820;0.5000;0.5820;0.6000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">31 也散列到 9，被占了 → 试 10 号格</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5820;0.6000;0.6820;0.7000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">10 号空着 → 放进去</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6820;0.7000;0.7820;0.8000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意：开放地址法的数组必须<tspan font-weight="700">开得比元素多</tspan>，留空位给探测</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7820;0.8000;0.8620;0.8800;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">42 又散列到 9，9 和 10 都被占 → 试 11？越界了，绕回 0 号格</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8620;0.8800;0.9420;0.9600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">0 号空 → 放进去。这就是&quot;绕回表头&quot;（模运算的效果）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9420;0.9600;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">和分离链接法对比：那个是每格挂链表，这个是所有元素挤在一个数组里</text></g></svg>