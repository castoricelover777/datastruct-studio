<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="InsertLinear —— 插入与删除"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="12s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">04-InsertLinear · InsertLinear —— 插入与删除</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">插入靠查找，删除要留墓碑</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">开放地址法</text><rect x="151" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">0</text><rect x="211" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="240" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">1</text><rect x="271" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="300" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">2</text><rect x="331" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="360" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">3</text><rect x="391" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="420" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">4</text><rect x="451" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="480" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">5</text><rect x="511" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="540" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">6</text><rect x="571" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="600" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">7</text><rect x="631" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="660" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">8</text><rect x="691" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="720" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">9</text><rect x="751" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="780" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">10</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5233;0.5333;8.2400;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="748" y="101" width="64" height="52" rx="9" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7400;0.7500;8.2400;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="148" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="691" y="104" width="58" height="46" rx="6" fill="#FFF6E0" stroke="#D29922" stroke-width="2"/><text x="720" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4383;0.4500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="751" y="104" width="58" height="46" rx="6" fill="#FFF6E0" stroke="#D29922" stroke-width="2"/><text x="780" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">31</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="151" y="104" width="58" height="46" rx="6" fill="#FFF6E0" stroke="#D29922" stroke-width="2"/><text x="180" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">42</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="211" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="240" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="271" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="300" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="331" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="360" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="391" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="420" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="451" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="480" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="511" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="540" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="571" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="600" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;8.2383;8.2500" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="631" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="660" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4383;0.4500;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="751" y="104" width="58" height="46" rx="6" fill="#FDECEC" stroke="#EF4444" stroke-width="2"/><text x="780" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">X</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1050;0.1167;0.4050;0.4167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">插入 = 查找 + 写入 —— 停下来那个位置正好就是该插的地方</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4383;0.4500;0.7383;0.7500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">删除 31 → 标成墓碑 X，**不能标 Empty**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7383;0.7500;0.9883;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="248" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">标 Empty 的话，查找走到这里就停了，42 就找不到了</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1017;0.1167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">插入不用另写一套逻辑 —— 它和查找是同一件事</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1017;0.1167;0.1850;0.2000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">查找按探测序列往后走，走到 Empty 就停</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1850;0.2000;0.2683;0.2833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">而这个停下来的空位，**正好就是插入该放的位置**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2683;0.2833;0.4350;0.4500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以插入 = 查找 + 写入，这是散列实现的惯用手法</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4350;0.4500;0.5183;0.5333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">删除要小心：**不能把格子标成 Empty**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5183;0.5333;0.6017;0.6167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">删掉 31（10 号格）之后，如果标成 Empty：</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6017;0.6167;0.6850;0.7000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">再查 42 时，探测从 9 开始 → 10 号格是 Empty → **查找停止** → 报「不存在」</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6850;0.7000;0.7350;0.7500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">但 42 明明在 0 号格！它被 Empty 挡住了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7350;0.7500;0.8017;0.8167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">正确做法：标成 **Deleted（墓碑）**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8017;0.8167;0.8683;0.8833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">查找遇到墓碑会**继续往后走**；插入时可以把它当空位复用</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8683;0.8833;0.9350;0.9500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一个格子同时满足两种需求 —— 这是散列里很经典的一个设计</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9350;0.9500;0.9850;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">还有个细节：插入遇到墓碑不能马上占，得继续找有没有相同的键</text></g></svg>