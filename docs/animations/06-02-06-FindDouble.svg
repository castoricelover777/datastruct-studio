  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-FindDouble · FindDouble —— 双散列</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">步长由关键字自己决定</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">开放地址法</text><rect x="151" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="180" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">0</text><rect x="211" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="240" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">1</text><rect x="271" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="300" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">2</text><rect x="331" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="360" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">3</text><rect x="391" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="420" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">4</text><rect x="451" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="480" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">5</text><rect x="511" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="540" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">6</text><rect x="571" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="600" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">7</text><rect x="631" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="660" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">8</text><rect x="691" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="720" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">9</text><rect x="751" y="104" width="58" height="46" rx="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="780" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">10</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="151" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="180" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="211" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="240" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="271" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="300" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="331" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="360" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="391" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="420" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="451" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="480" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="511" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="540" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="571" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="600" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="631" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="660" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="691" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="720" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2969;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="751" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="780" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">-</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2969;0.3077;7.6046;7.6154" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="691" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="720" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4662;0.4769;7.6046;7.6154" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="751" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="780" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">31</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6354;0.6462;7.6046;7.6154" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="271" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="300" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">42</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8046;0.8154;7.6046;7.6154" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="511" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="540" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">53</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9123;0.9231;7.6046;7.6154" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="331" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="360" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">64</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9738;0.9846;7.6046;7.6154" dur="13s" repeatCount="indefinite" calcMode="linear"/><rect x="451" y="104" width="58" height="46" rx="6" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><text x="480" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">75</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3738;0.3846;0.4969;0.5077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="720" y1="182" x2="780" y2="182" stroke="#D29922" stroke-width="1.5" stroke-dasharray="4 3"/><text x="750" y="197" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" fill="#D29922">20 的步长 1：9→10→0→1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4969;0.5077;0.6508;0.6615;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="720" y1="182" x2="300" y2="182" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 3"/><text x="510" y="197" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" fill="#3B82F6">31 的步长 4：9→2→6→10</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6508;0.6615;0.8046;0.8154;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><line x1="720" y1="182" x2="540" y2="182" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3"/><text x="630" y="197" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11" fill="#10B981">42 的步长 3：9→1→4→7</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0969;0.1077;0.4969;0.5077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">探测序列：h(k) + i × h₂(k)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4969;0.5077;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">20 步长 1，31 步长 4，42 步长 3 —— **各走各的路**</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">所以既没有一次聚集，也没有二次聚集 —— 效果最好</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9892;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">代价：多算一次散列函数，且 h₂(k) 必须不为 0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0938;0.1077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">双散列的探测序列：h(k) + i × h₂(k)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0938;0.1077;0.2938;0.3077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">步长不再是固定的 1（线性）或 1,4,9（平方），而是**由关键字算出来的**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2938;0.3077;0.3708;0.3846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">表长 11，h₂(k) = R − (k % R)（R 是小于 11 的素数 7）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3708;0.3846;0.4938;0.5077;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">20：h=9，h₂=7−(20%7)=1 → 路径 9、10、0、1……</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4938;0.5077;0.5554;0.5692;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">31：h=9，h₂=7−(31%7)=4 → 路径 9、2、6、10……</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5554;0.5692;0.6323;0.6462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**起点相同，但走的路子完全不一样**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6323;0.6462;0.7554;0.7692;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">42：h=9，h₂=7−(42%7)=7 → 路径 9、5、1、8……</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7554;0.7692;0.8323;0.8462;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这就是双散列的关键优势：***散列到同一位置的元素也会分开***</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8323;0.8462;0.8631;0.8769;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以既没有一次聚集（连续块），也没有二次聚集（同起点同序列）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8631;0.8769;0.9246;0.9385;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">它最接近&quot;随机探测&quot;的理想效果，冲突最少</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.9246;0.9385;0.9708;0.9846;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代价有两个：多算一个散列函数；h₂(k) 必须保证不为 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9708;0.9846;0.9862;1.0000" dur="13s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">（表长取素数能保证 h₂(k) 与它互质，从而走遍全表）</text></g></svg>