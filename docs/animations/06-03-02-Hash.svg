    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">02-Hash · Hash —— 散列定位到桶</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">算出的位置就是最终归属</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">分离链接法</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="301" y1="84" x2="407" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 413 84 L 404 88.5 L 404 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="456" y1="84" x2="489" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 495 84 L 486 88.5 L 486 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="538" y1="84" x2="571" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 577 84 L 568 88.5 L 568 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="620" y1="84" x2="653" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 659 84 L 650 88.5 L 650 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="301" y1="113" x2="407" y2="113" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 413 113 L 404 117.5 L 404 108.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="301" y1="170" x2="407" y2="170" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 413 170 L 404 174.5 L 404 165.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="456" y1="170" x2="489" y2="170" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 495 170 L 486 174.5 L 486 165.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="84" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="280" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="113" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="280" y="118.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="141" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="280" y="146.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="170" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="280" y="175.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="198" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="280" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="435" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="435" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="517" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="517" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">11</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="599" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="599" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">22</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="681" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="681" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">33</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="435" cy="113" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="435" y="118.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="435" cy="170" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="435" y="175.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="517" cy="170" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="517" y="175.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1400;0.1556;0.5400;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">11、22、33 都对 5 取余得 1？这里都落在 0 号桶</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5400;0.5556;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">开放地址法里散列位置只是「起点」，冲突了还要探测</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0.0000;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">分离链接法里它是**最终归属** —— 挂哪条链之后就不动了</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1356;0.1556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列函数的作用在这里变了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1356;0.1556;0.2689;0.2889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">它算出的位置，决定了这个元素**挂在哪条链表上**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2689;0.2889;0.4244;0.4444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">算完之后元素就在那条链上，不会再动 —— 没有&quot;探测&quot;这一步</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4244;0.4444;0.5578;0.5778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">对比一下：开放地址法里散列位置只是&quot;起点&quot;，冲突了还要往后探测</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5578;0.5778;0.7022;0.7222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">分离链接法里它是**最终归属**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7022;0.7222;0.8022;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以散列函数的质量对这里影响更直接</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8022;0.8222;0.8689;0.8889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列函数好 → 各条链长度差不多 → 查找走几步就够</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8689;0.8889;0.9356;0.9556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列函数差 → 有的链很长、有的空着 → 长的那些退化成线性查找</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9356;0.9556;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看这张图：0 号桶挂了 4 个，2 号和 4 号空着 —— 这就是分布不均</text></g></svg>