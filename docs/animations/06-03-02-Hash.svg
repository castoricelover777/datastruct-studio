      <animate attributeName="width" values="0;888" dur="9s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">02-Hash · Hash —— 散列定位到桶</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">算出的位置就是最终归属</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">分离链接法</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="106" x2="322" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 106 L 319 110.5 L 319 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="371" y1="106" x2="404" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 410 106 L 401 110.5 L 401 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="453" y1="106" x2="486" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 492 106 L 483 110.5 L 483 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="535" y1="106" x2="568" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 574 106 L 565 110.5 L 565 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="148" x2="322" y2="148" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 148 L 319 152.5 L 319 143.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="232" x2="322" y2="232" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 232 L 319 236.5 L 319 227.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><line x1="371" y1="232" x2="404" y2="232" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 410 232 L 401 236.5 L 401 227.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="195" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="148" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="195" y="153.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="190" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="195" y="195.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="232" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="195" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="274" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="195" y="279.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="106" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="350" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="432" cy="106" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="432" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">11</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="514" cy="106" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="514" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">22</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="106" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="596" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">33</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="148" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="350" y="153.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="232" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="350" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0956;0.1111;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><circle cx="432" cy="232" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="432" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1400;0.1556;0.5400;0.5556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">11、22、33 都对 5 取余得 1？这里都落在 0 号桶</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4289;0.4444;0.8733;0.8889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#3B82F6">开放地址法里散列位置只是「起点」，冲突了还要探测</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7067;0.7222;0.9844;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">分离链接法里它是**最终归属** —— 挂哪条链之后就不动了</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1356;0.1556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列函数的作用在这里变了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1356;0.1556;0.2689;0.2889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">它算出的位置，决定了这个元素**挂在哪条链表上**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2689;0.2889;0.4244;0.4444;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">算完之后元素就在那条链上，不会再动 —— 没有&quot;探测&quot;这一步</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4244;0.4444;0.5578;0.5778;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">对比一下：开放地址法里散列位置只是&quot;起点&quot;，冲突了还要往后探测</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5578;0.5778;0.7022;0.7222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">分离链接法里它是**最终归属**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7022;0.7222;0.8022;0.8222;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以散列函数的质量对这里影响更直接</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8022;0.8222;0.8689;0.8889;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列函数好 → 各条链长度差不多 → 查找走几步就够</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8689;0.8889;0.9356;0.9556;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列函数差 → 有的链很长、有的空着 → 长的那些退化成线性查找</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9356;0.9556;0.9800;1.0000" dur="9s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看这张图：0 号桶挂了 4 个，2 号和 4 号空着 —— 这就是分布不均</text></g></svg>