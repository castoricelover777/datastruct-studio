<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="Insert —— 插入：先查重再头插"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">04-Insert · Insert —— 插入：先查重再头插</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">新结点挂到链表最前面</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">分离链接法</text><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="106" x2="322" y2="106" stroke="#10B981" stroke-width="3"/><path d="M 328 106 L 319 110.5 L 319 101.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="371" y1="106" x2="404" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 410 106 L 401 110.5 L 401 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="453" y1="106" x2="486" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 492 106 L 483 110.5 L 483 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="535" y1="106" x2="568" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 574 106 L 565 110.5 L 565 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="148" x2="322" y2="148" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 148 L 319 152.5 L 319 143.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="232" x2="322" y2="232" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 232 L 319 236.5 L 319 227.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="371" y1="232" x2="404" y2="232" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 410 232 L 401 236.5 L 401 227.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="195" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="148" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="195" y="153.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="190" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="195" y="195.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="232" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="195" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="274" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="195" y="279.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="106" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="350" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="432" cy="106" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="432" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">11</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="514" cy="106" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="514" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">22</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="106" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="596" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">33</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="148" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="350" y="153.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="232" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="350" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="432" cy="232" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="432" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4418;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">① 先 Find 查重 —— 已存在就不重复插入</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4418;0.4545;0.8055;0.8182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">② 造新结点，**头插**到那条链上：O(1)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8055;0.8182;0.9873;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">后果：同一条链的顺序和插入顺序**相反**</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1291;0.1455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">插入也是两步</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1291;0.1455;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 先查找，看这个键是不是已经存在</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.3291;0.3455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列表到底允不允许重复关键字？这取决于用途</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3291;0.3455;0.3836;0.4000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">作为「集合」用（去重）→ 不允许，插入前要查重</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3836;0.4000;0.4382;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">作为「多重集」用（统计词频）→ 允许，或者结点里加计数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4382;0.4545;0.5655;0.5818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 不存在 → 造新结点，**头插**到对应链表上</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5655;0.5818;0.6564;0.6727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">头插只要 O(1)，不用找尾 —— 和邻接表里插件点的做法一样</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6564;0.6727;0.7109;0.7273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代价是链表里的顺序和插入顺序**相反**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7109;0.7273;0.8018;0.8182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">要按插入顺序输出的话，得改成尾插（多一个尾指针）或者插完反转</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8018;0.8182;0.8745;0.8909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">（Java 的 HashMap 采取的是&quot;键相同就覆盖值&quot;，也是一种处理方式）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.8745;0.8909;0.9836;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意：查重会让每次插入多走一次链表 —— 想省这点开销也可以不查</text></g></svg>