<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="Insert —— 插入：先查重再头插"><rect width="960" height="340" fill="#FFFFFF"/><g>
    <rect x="36" y="308" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="308" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">04-Insert · Insert —— 插入：先查重再头插</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">新结点挂到链表最前面</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">分离链接法</text><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="301" y1="84" x2="407" y2="84" stroke="#10B981" stroke-width="3"/><path d="M 413 84 L 404 88.5 L 404 79.5 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="456" y1="84" x2="489" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 495 84 L 486 88.5 L 486 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="538" y1="84" x2="571" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 577 84 L 568 88.5 L 568 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="620" y1="84" x2="653" y2="84" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 659 84 L 650 88.5 L 650 79.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="301" y1="113" x2="407" y2="113" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 413 113 L 404 117.5 L 404 108.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="301" y1="170" x2="407" y2="170" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 413 170 L 404 174.5 L 404 165.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><line x1="456" y1="170" x2="489" y2="170" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 495 170 L 486 174.5 L 486 165.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="84" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="280" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="113" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="280" y="118.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="141" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="280" y="146.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="170" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="280" y="175.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="280" cy="198" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="280" y="203.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="435" cy="84" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="435" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="517" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="517" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">11</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="599" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="599" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">22</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="681" cy="84" r="21" fill="#EAF2FE" stroke="#3B82F6" stroke-width="2.6"/><text x="681" y="89.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">33</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="435" cy="113" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="435" y="118.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="435" cy="170" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="435" y="175.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><circle cx="517" cy="170" r="21" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/><text x="517" y="175.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4418;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">① 先 Find 查重 —— 已存在就不重复插入</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4418;0.4545;0.8055;0.8182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">② 造新结点，**头插**到那条链上：O(1)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8055;0.8182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">后果：同一条链的顺序和插入顺序**相反**</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1291;0.1455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">插入也是两步</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1291;0.1455;0.2564;0.2727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">① 先查找，看这个键是不是已经存在</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2564;0.2727;0.3291;0.3455;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">散列表到底允不允许重复关键字？这取决于用途</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3291;0.3455;0.3836;0.4000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">作为「集合」用（去重）→ 不允许，插入前要查重</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3836;0.4000;0.4382;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">作为「多重集」用（统计词频）→ 允许，或者结点里加计数</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4382;0.4545;0.5655;0.5818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">② 不存在 → 造新结点，<tspan font-weight="700">头插</tspan>到对应链表上</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5655;0.5818;0.6564;0.6727;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">头插只要 O(1)，不用找尾 —— 和邻接表里插件点的做法一样</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6564;0.6727;0.7109;0.7273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代价是链表里的顺序和插入顺序<tspan font-weight="700">相反</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7109;0.7273;0.8018;0.8182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">要按插入顺序输出的话，得改成尾插（多一个尾指针）或者插完反转</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8018;0.8182;0.8745;0.8909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">（Java 的 HashMap 采取的是&quot;键相同就覆盖值&quot;，也是一种处理方式）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8745;0.8909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">注意：查重会让每次插入多走一次链表 —— 想省这点开销也可以不查</text></g></svg>