<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="PrintTable —— 看最长链表"><rect width="960" height="300" fill="#FFFFFF"/><g>
    <rect x="36" y="268" width="888" height="2.5" rx="1.25" fill="#D8DEE4"/>
    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">06-PrintTable · PrintTable —— 看最长链表</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">性能由最长的那条决定</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">分离链接法</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="106" x2="322" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 106 L 319 110.5 L 319 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="371" y1="106" x2="404" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 410 106 L 401 110.5 L 401 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="453" y1="106" x2="486" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 492 106 L 483 110.5 L 483 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="535" y1="106" x2="568" y2="106" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 574 106 L 565 110.5 L 565 101.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="148" x2="322" y2="148" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 148 L 319 152.5 L 319 143.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="216" y1="232" x2="322" y2="232" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 328 232 L 319 236.5 L 319 227.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><line x1="371" y1="232" x2="404" y2="232" stroke="#D8DEE4" stroke-width="1.8"/><path d="M 410 232 L 401 236.5 L 401 227.5 Z" fill="#D8DEE4"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="195" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="148" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="195" y="153.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="190" r="21" fill="#FDECEC" stroke="#EF4444" stroke-width="2.6"/><text x="195" y="195.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="232" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="195" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="195" cy="274" r="21" fill="#FDECEC" stroke="#EF4444" stroke-width="2.6"/><text x="195" y="279.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="350" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="432" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="432" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">11</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="514" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="514" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">22</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="596" cy="106" r="21" fill="#FFF6E0" stroke="#D29922" stroke-width="2.6"/><text x="596" y="111.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">33</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="148" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="350" y="153.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="350" cy="232" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="350" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1860;0.2000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><circle cx="432" cy="232" r="21" fill="#E7F7F1" stroke="#10B981" stroke-width="2.6"/><text x="432" y="237.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">15</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1860;0.2000;0.6860;0.7000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#EF4444">0 号桶挂 4 个，2 号和 4 号空着 —— 平均长度一样，但最长差很多</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4860;0.5000;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#D29922">所以光看平均装填因子不够，还要看**最长链表**有多长</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7460;0.7600;0.9860;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="258" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#10B981">Java 8：链表长度超过 8 就转红黑树 —— 把最坏从 O(n) 降到 O(log n)</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1820;0.2000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">对分离链接法来说，**性能直接由最长的链表决定**</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1820;0.2000;0.3220;0.3400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">看这张图：0 号桶挂了 4 个元素，2 号和 4 号空着</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3220;0.3400;0.4220;0.4400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">平均长度可能只有 1.5，但最长是 4</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4220;0.4400;0.4820;0.5000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">那 4 个元素的查找都是 O(4)，比平均值差多了</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4820;0.5000;0.5820;0.6000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以光看平均装填因子不够，**最长链表**更值得关注</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5820;0.6000;0.6820;0.7000;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">理论上 n 个元素散到 m 个桶里，最长链表大约是 O(log n / log log n)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6820;0.7000;0.7420;0.7600;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">但散列函数有缺陷时，最长链表可能长得多 —— 所以这个统计很有诊断价值</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7420;0.7600;0.8220;0.8400;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">Java 8 给 HashMap 加的规则就是这个思路的极致：</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8220;0.8400;0.9020;0.9200;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">**链表长度超过 8 就转成红黑树**，把最坏情况从 O(n) 降到 O(log n)</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.9020;0.9200;0.9820;1.0000" dur="10s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这是&quot;链表 + 树&quot;的混合结构，兼顾了两者的优点</text></g></svg>