x="6" fill="#F6F8FA" stroke="#D8DEE4" stroke-width="1" stroke-dasharray="3 3"/><text x="630" y="166" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="10.5" fill="#6E7781">5</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0733;0.0833;0.1567;0.1667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="298" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1567;0.1667;0.2400;0.2500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="358" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2400;0.2500;0.3233;0.3333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="418" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3233;0.3333;0.4067;0.4167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="478" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4567;0.4667;0.5567;0.5667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="358" y="101" width="64" height="52" rx="9" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5567;0.5667;0.6400;0.6500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="418" y="101" width="64" height="52" rx="9" fill="#D29922" fill-opacity="0.10" stroke="#D29922" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6567;0.6667;0.7400;0.7500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="418" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7400;0.7500;0.8233;0.8333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="478" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8233;0.8333;0.9067;0.9167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="538" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.9067;0.9167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="598" y="101" width="64" height="52" rx="9" fill="#10B981" fill-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="301" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="330" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">a</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="361" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="390" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">b</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="421" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="450" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">a</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="481" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="510" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">b</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="541" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="570" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">a</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><rect x="601" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="630" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">c</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0383;0.0500;0.4550;0.4667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#3B82F6">S = a b a b a c        P = a b a b</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4550;0.4667;0.5217;0.5333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">第 1 轮：i=0 起手，四个字符全中 → 找到下标 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5217;0.5333;0.7217;0.7333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">第 2 轮：i=1 起手，第 1 个字符就不等 → 整个作废</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.7217;0.7333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">第 3 轮：i=2 起手，四个字符又全中 —— 前面比过的又比了一遍</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0683;0.0833;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">暴力匹配：从主串每个位置起手，逐字符和模式串比</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0683;0.0833;0.1517;0.1667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">i=0 起手：S[0]=a 对上 P[0]=a，两个指针一起前进</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1517;0.1667;0.2350;0.2500;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">S[1]=b 对上 P[1]=b —— 继续</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2350;0.2500;0.3183;0.3333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">S[2]=a 对上 P[2]=a —— 继续</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3183;0.3333;0.4517;0.4667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">S[3]=b 对上 P[3]=b —— 整个模式串比完，返回下标 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4517;0.4667;0.5517;0.5667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">i=1 起手：S[1]=b 对上 P[0]=a，<tspan font-weight="700">第一个字符就不等</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5517;0.5667;0.6517;0.6667;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这个起手位置作废，i 前进一格 —— 刚才比过的 b 又要重比</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6517;0.6667;0.8183;0.8333;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">i=2 起手：a、b、a、b 四个字符<tspan font-weight="700">又全比一遍</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8183;0.8333;0.9017;0.9167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这些比较里有一半是重复劳动 —— KMP 要省的就是这部分</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.9017;0.9167;1.0000" dur="12s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">最坏情况 S=aaaa...ab、P=aaab 时，每个位置都比 m 次 → O(n·m)</text></g></svg>