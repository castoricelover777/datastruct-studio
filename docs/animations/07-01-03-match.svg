-opacity="0.10" stroke="#10B981" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3164;0.3273;0.4436;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="358" y="101" width="64" height="52" rx="9" fill="#D29922" fill-opacity="0.10" stroke="#D29922" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3164;0.3273;0.4436;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="538" y="101" width="64" height="52" rx="9" fill="#D29922" fill-opacity="0.10" stroke="#D29922" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="301" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="330" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">a</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="361" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="390" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">b</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="421" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="450" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">a</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="481" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="510" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">b</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="541" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="570" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">a</text></g><g opacity="0"><animate attributeName="opacity" values="1;1" keyTimes="0.0000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><rect x="601" y="104" width="58" height="46" rx="6" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.4"/><text x="630" y="132.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">c</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0782;0.0909;0.6418;0.6545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><path d="M 330 100 l -6 -9 l 12 0 Z" fill="#10B981"/><text x="330" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#10B981">pre</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0782;0.0909;0.1873;0.2000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><path d="M 510 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="510" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">suf</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1873;0.2000;0.3145;0.3273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><path d="M 570 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="570" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">suf</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3145;0.3273;0.6418;0.6545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><path d="M 630 100 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="630" y="88" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12" font-weight="600" fill="#D29922">suf</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0782;0.0909;0.1873;0.2000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">j=2：&quot;aba&quot; 的前缀 a == 后缀 a → 长度 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1873;0.2000;0.3145;0.3273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">j=3：&quot;abab&quot; 的前缀 ab == 后缀 ab → 长度 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3145;0.3273;0.4418;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">j=4：&quot;ababa&quot; 的前缀 aba == 后缀 aba → 长度 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4418;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="210" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">j=5：&quot;ababac&quot; 前后缀都对不上 → 0（不是&quot;差不多&quot;，是严格相等）</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0745;0.0909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">这一节只有一个定义，但它就是整个 KMP 的地基</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0745;0.0909;0.1836;0.2000;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">j=2：看 &quot;aba&quot; —— 前缀取 &quot;a&quot;、后缀取 &quot;a&quot;，相等 → match[2] = 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1836;0.2000;0.3109;0.3273;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">j=3：看 &quot;abab&quot; —— 前缀 &quot;ab&quot;、后缀 &quot;ab&quot; 相等 → match[3] = 2</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3109;0.3273;0.4382;0.4545;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">j=4：看 &quot;ababa&quot; —— 前缀 &quot;aba&quot;、后缀 &quot;aba&quot; 相等 → match[4] = 3</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4382;0.4545;0.5655;0.5818;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">j=5：看 &quot;ababac&quot; —— 结尾是 c，任何长度的前后缀都不相等 → 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5655;0.5818;0.6927;0.7091;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">两个限定要记牢：必须是<tspan font-weight="700">真</tspan>前后缀（不能是整个串），而且必须<tspan font-weight="700">严格相等</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6927;0.7091;0.8018;0.8182;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">为什么要这个数？它回答：&quot;开头和结尾最多重叠几个字符&quot;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8018;0.8182;0.8745;0.8909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">失配时，这段重叠的内容已经确认匹配过了，<tspan font-weight="700">没必要重比</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.8745;0.8909;1.0000" dur="11s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="250" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">所以模式串能直接从 match[j-1] 那个位置接着比 —— 这就是&quot;滑&quot;的依据</text></g></svg>