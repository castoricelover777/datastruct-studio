    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#8250DF">
      <animate attributeName="width" values="0;888" dur="9.6s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">13 · freeList —— 释放整条链表</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">释放只用到 next 方向</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#8250DF">双向链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2354;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="304" y1="110" x2="355" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 362 110 L 355 105.4 L 355 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2354;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="376" y1="128" x2="325" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 318 128 L 325 123.4 L 325 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3812;0.3958;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="444" y1="110" x2="495" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 502 110 L 495 105.4 L 495 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.3812;0.3958;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="516" y1="128" x2="465" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 458 128 L 465 123.4 L 465 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5479;0.5625;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="584" y1="110" x2="635" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 642 110 L 635 105.4 L 635 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5479;0.5625;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><line x1="656" y1="128" x2="605" y2="128" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 598 128 L 605 123.4 L 605 132.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.7563;0.7708;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="222" y="96" width="96" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="250" y1="96" x2="250" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="290" y1="96" x2="290" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="255" y1="135" x2="285" y2="103" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="236" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="304" cy="119" r="3.6" fill="#3B82F6"/><text x="270" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.2354;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="362" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="390" y1="96" x2="390" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="430" y1="96" x2="430" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="410" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="376" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="444" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4021;0.4167;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="502" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="530" y1="96" x2="530" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="570" y1="96" x2="570" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="550" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="516" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="584" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.5687;0.5833;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="642" y="96" width="96" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="670" y1="96" x2="670" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="710" y1="96" x2="710" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="690" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">30</text><circle cx="656" cy="119" r="3.4" fill="#3B82F6" opacity="0.85"/><circle cx="724" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1542;0.1667;0.2375;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="359" y="93" width="102" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3208;0.3333;0.4042;0.4167;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="499" y="93" width="102" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4875;0.5000;0.5708;0.5833;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="639" y="93" width="102" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6750;0.6875;0.7583;0.7708;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><rect x="219" y="93" width="102" height="52" rx="10" fill="#EF4444" fill-opacity="0.10" stroke="#EF4444" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0688;0.0833;0.6313;0.6458;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 0;0 0;280.0 0;280.0 0" keyTimes="0.0000;0.0833;0.5000;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><path d="M 410 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="410" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0688;0.0833;0.6313;0.6458;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="184" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#8250DF">q = p;  p = p-&gt;next;  free(q);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6313;0.6458;0.7771;0.7917;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="168" y="184" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">释放时压根用不到 prior —— 走完链只需要 next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7771;0.7917;0.9854;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="184" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#6E7781">最后 free(*L) 并把 L 置 NULL，避免野指针</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.0646;0.0833;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">双向链表也要逐个把结点还回去</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0646;0.0833;0.2312;0.2500;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">三步一组，和单链表完全一样</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">q = p;      /* 先记住当前 */
p = p-&gt;next; /* 再往后走 */
free(q);     /* 最后才释放 */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2312;0.2500;0.6271;0.6458;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">虽然结点里有 prior，但释放根本用不到它 —— 走完链只需要 next 方向</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6271;0.6458;0.7729;0.7917;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">数据结点清完，头结点也要还回去</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">free(*L);   *L = NULL;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7729;0.7917;0.9813;1.0000" dur="9.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">尤其注意：不要在 free 之后再去碰 p-&gt;prior 之类的指针 —— 那已经是垃圾内存了</text></g></svg>