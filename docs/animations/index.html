<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkList Studio · 模块演示动画</title>
<style>
  :root{
    --bg:#F6F8FA; --panel:#FFFFFF; --line:#E4E8EC; --ink:#1F2328; --dim:#6E7781;
    --blue:#3B82F6; --mono:ui-monospace,'Cascadia Code',Consolas,monospace;
    --ui:'Segoe UI','Microsoft YaHei UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
       -webkit-font-smoothing:antialiased;padding:48px 32px 80px}
  header{max-width:1120px;margin:0 auto 40px}
  h1{margin:0 0 10px;font-size:30px;letter-spacing:-.4px}
  .lede{margin:0;color:var(--dim);font-size:15px;line-height:1.75;max-width:74ch}
  .lede b{color:var(--ink);font-weight:600}
  .group{max-width:1120px;margin:0 auto 52px}
  h2{font-size:15px;font-weight:600;letter-spacing:.2px;margin:0 0 18px;
     padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;
     align-items:baseline;gap:10px}
  .count{font-weight:400;color:var(--dim);font-size:12.5px;font-family:var(--mono)}
  .grid{display:grid;gap:22px}
  .card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;
        overflow:hidden;box-shadow:0 1px 2px rgba(27,31,36,.04)}
  .frame{border-bottom:1px solid var(--line);background:#fff}
  .anim{display:block;width:100%;height:auto}
  figcaption{padding:13px 18px 15px;display:flex;flex-direction:column;gap:3px}
  figcaption b{font-size:13.5px;font-weight:600}
  figcaption span{font-size:12.5px;color:var(--dim)}
  footer{max-width:1120px;margin:0 auto;color:var(--dim);font-size:12.5px;
         border-top:1px solid var(--line);padding-top:18px}
  code{font-family:var(--mono);font-size:12px;background:#EDF1F5;padding:1.5px 6px;border-radius:4px}
</style>
</head>
<body>
<header>
  <h1>LinkList Studio · 模块演示动画</h1>
  <p class="lede">
    每个代码模块一段动画，把 <b>那一句指针赋值到底改变了什么</b> 演出来。
    动画用 SVG 内联的 SMIL 写成，因此放进 README 也能直接播放。
    结点里的圆点是指针域，<b style="color:#3B82F6">蓝色</b>是已有连接，
    <b style="color:#10B981">绿色</b>是本步新建的结点与新的连接，
    <b style="color:#EF4444">红色</b>是即将被摘除的结点。
  </p>
</header>

    <section class="group">
      <h2>单链表 <span class="count">12 个模块</span></h2>

ngFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">数据域 data</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2825;0.3000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="624" y="123" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#1F2328">指针域 next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1325;0.1500;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="336" y="143" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#6E7781">存具体元素</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2825;0.3000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="624" y="143" text-anchor="start" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#6E7781">存下一个结点在哪</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9825;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="480" y="74" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">struct LNode</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1275;0.1500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">一个链表结点由两部分组成：数据域 + 指针域</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1275;0.1500;0.2775;0.3000;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">data 存具体元素；它是什么类型由 ElemType 决定</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2775;0.3000;0.4650;0.4875;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">next 存&quot;下一个结点的地址&quot;，它就是链表能串起来的原因</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4650;0.4875;0.7275;0.7500;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">typedef 把这套写法包成两个短名字：</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">typedef struct LNode { ElemType data; struct LNode *next; } LNode, *LinkList;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7275;0.7500;0.9775;1.0000" dur="8s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">LNode 是结点类型，LinkList 是指向结点的指针类型（少写一个 *）</text></g></svg></div>

e" calcMode="linear"/><path d="M 248 93 l -6 -9 l 12 0 Z" fill="#D29922"/><text x="248" y="81" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="600" fill="#D29922">p</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3326;0.3478;0.4630;0.4783;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">q = p-&gt;next  →  q 记住待删结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4630;0.4783;0.5935;0.6087;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#6E7781">*e = q-&gt;data  （必须在 free 之前取出）</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5935;0.6087;0.7348;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">p-&gt;next = q-&gt;next  →  绕过 q</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7348;0.7500;0.9848;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="234" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#EF4444">free(q)  结点还给系统</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1109;0.1304;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">删除第 i 个结点：单链表必须先找到它的前驱</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1109;0.1304;0.3283;0.3478;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">p 走到第 i-1 个结点 —— 因为只有前驱能改 next 把待删结点绕过去</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">while (p-&gt;next != NULL &amp;&amp; j &lt; i - 1) { p = p-&gt;next; j++; }</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3283;0.3478;0.4587;0.4783;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">用 q 记住待删结点</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">q = p-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4587;0.4783;0.5891;0.6087;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">先把数据取出来 —— 必须在 free 之前做</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">*e = q-&gt;data;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5891;0.6087;0.7304;0.7500;1.0000" dur="9.2s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">摘链：前驱直接跨过 q，指向 q 的后继</
