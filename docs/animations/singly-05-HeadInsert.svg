    <rect x="36" y="268" width="0" height="2.5" rx="1.25" fill="#3B82F6">
      <animate attributeName="width" values="0;888" dur="8.6s" repeatCount="indefinite" calcMode="linear"/>
    </rect>
  </g><text x="36" y="40" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="19" font-weight="600" fill="#1F2328">05 · HeadInsert —— 头插法插入</text><text x="36" y="63" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#6E7781">不遍历，直接插在头结点后面</text><text x="924" y="40" text-anchor="end" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="12.5" fill="#3B82F6">单链表</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.4023;0.4186;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><line x1="323" y1="110" x2="497" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 504 110 L 497 105.4 L 497 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><line x1="555" y1="110" x2="613" y2="110" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/><path d="M 620 110 L 613 105.4 L 613 114.6 Z" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.5186;0.5349;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><line x1="323" y1="110" x2="381" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="65 65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" values="65;65;0;0;65" keyTimes="0;0.5326;0.5744;0.9996;1" dur="8.6s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 388 110 L 381 105.4 L 381 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.4023;0.4186;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><line x1="439" y1="110" x2="497" y2="110" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="65 65" stroke-dashoffset="65"><animate attributeName="stroke-dashoffset" values="65;65;0;0;65" keyTimes="0;0.4163;0.4581;0.9996;1" dur="8.6s" repeatCount="indefinite" calcMode="linear"/></line><path d="M 504 110 L 497 105.4 L 497 114.6 Z" fill="#10B981"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><rect x="272" y="96" width="68" height="46" rx="8" fill="#F1F3F5" stroke="#AFB8C1" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="306" y1="96" x2="306" y2="142" stroke="#D0D7DE" stroke-width="1"/><line x1="278" y1="134" x2="300" y2="104" stroke="#D8DEE4" stroke-width="1.4"/><circle cx="323" cy="119" r="3.6" fill="#3B82F6"/><text x="306" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">L</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2860;0.3023;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><animateTransform attributeName="transform" type="translate" values="0 16;0 0;0 0" keyTimes="0;0.3023;1" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><rect x="388" y="96" width="68" height="46" rx="8" fill="#E7F7F1" stroke="#10B981" stroke-width="2"/><line x1="422" y1="96" x2="422" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="405" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">5</text><circle cx="439" cy="119" r="3.6" fill="#3B82F6"/><text x="422" y="159" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="11.5" fill="#6E7781">s</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><rect x="504" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="538" y1="96" x2="538" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="521" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">10</text><circle cx="555" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0" keyTimes="0.0000;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><rect x="620" y="96" width="68" height="46" rx="8" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.2"/><line x1="654" y1="96" x2="654" y2="142" stroke="#D0D7DE" stroke-width="1"/><text x="637" y="124.5" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="15" fill="#1F2328">20</text><circle cx="671" cy="119" r="3.6" fill="#3B82F6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5209;0.5349;0.6605;0.6744;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><rect x="303" y="93" width="40" height="52" rx="10" fill="#3B82F6" fill-opacity="0.10" stroke="#3B82F6" stroke-width="1.6"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4023;0.4186;0.5186;0.5349;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="248" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">① s-&gt;next = L-&gt;next</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5186;0.5349;0.7279;0.7442;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="248" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#10B981">② L-&gt;next = s</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7279;0.7442;0.9837;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="248" y="186" text-anchor="start" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" font-weight="400" fill="#D29922">全程没有遍历任何一个结点</text></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0.0000;0.1186;0.1395;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">头插法：新结点直接插到头结点后面，成为第 1 个结点</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1186;0.1395;0.2814;0.3023;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">和尾插最大的区别：它完全不需要遍历 —— 时间复杂度 O(1)</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">/* 尾插要走到尾：O(n)   头插原地完成：O(1) */</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2814;0.3023;0.3977;0.4186;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">造出新结点 s</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s = creatNode(e);</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3977;0.4186;0.5140;0.5349;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第一步：让 s 先接住原来的第一个结点</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">s-&gt;next = L-&gt;next;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5140;0.5349;0.7233;0.7442;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">第二步：头结点改指 s —— s 正式成为第 1 个</text><text x="36" y="240" font-family="ui-monospace,'Cascadia Code','JetBrains Mono',Consolas,monospace" font-size="12.5" fill="#3B82F6">L-&gt;next = s;</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.7233;0.7442;0.9791;1.0000" dur="8.6s" repeatCount="indefinite" calcMode="linear"/><text x="36" y="214" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,sans-serif" font-size="14" fill="#1F2328">代价：头插会颠倒顺序，依次头插 1、2、3 得到 3、2、1</text></g></svg>