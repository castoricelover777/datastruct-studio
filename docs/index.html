<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>数据结构研习社 · DataStruct Studio</title>
  <!-- 必须放在最前面：在首帧之前就定好主题，避免深色用户启动时闪白屏 -->
  <script src="app/theme-boot.js"></script>
  <link rel="stylesheet" href="app/styles.css" />
  <link rel="stylesheet" href="app/styles-v2.css" />
  <link rel="stylesheet" href="app/web.css" />
</head>
<body>
  <div class="app">

    <!-- ================= 左侧：三层导航树 ================= -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">DS</div>
        <div class="brand-text">
          <div class="brand-title">DataStruct Studio</div>
          <div class="brand-sub">数据结构研习社</div>
        </div>
        <button type="button" class="icon-btn" id="btnCollapseSidebar" title="折叠侧栏（Ctrl+B）">‹</button>
      </div>

      <div class="sidebar-search">
        <input id="searchInput" type="search" placeholder="搜索模块，如 AVL / BFS / 快排" autocomplete="off" />
        <button type="button" class="icon-btn" id="btnClearSearch" title="清空">✕</button>
      </div>

      <nav class="tree" id="tree" aria-label="课程目录"></nav>

      <div class="sidebar-foot">
        <div class="progress-mini">
          <div class="progress-mini-bar"><span id="progressMiniFill"></span></div>
          <div class="progress-mini-text" id="progressMiniText">练习进度 0 / 0</div>
        </div>
        <button type="button" class="link-btn" id="btnCoverage">模块覆盖清单</button>
      </div>
    </aside>

    <!-- ================= 右侧：内容区 ================= -->
    <main class="content">
      <div class="web-banner">
        <span>这是<b>在线版</b>：阅读、默写、对照、动画都能用；但浏览器里没有 C 编译器，<b>编译运行请用桌面版</b>（自带 TCC）。</span>
        <span class="spacer"></span>
        <a href="https://github.com/castoricelover777/datastruct-studio/releases/latest" target="_blank" rel="noopener">下载桌面版</a>
      </div>
      <header class="module-header">
        <div class="mh-line1">
          <span class="mh-breadcrumb" id="mhBreadcrumb"></span>
        </div>
        <h1 class="mh-title"><span class="mh-id" id="mhId">—</span><span id="mhName">请选择一个模块</span></h1>
        <p class="mh-summary" id="mhSummary"></p>
        <div class="mh-meta">
          <span class="chip chip-diff" id="mhDiff"></span>
          <span class="chip chip-dep" id="mhDeps"></span>
          <span class="chip chip-lines" id="mhLines"></span>
          <span class="chip chip-status" id="mhStatus"></span>
        </div>
      </header>

      <div class="toolbar">
        <div class="segmented" id="commentModes" role="group" aria-label="注释模式">
          <button type="button" data-mode="detail">详细注释</button>
          <button type="button" data-mode="short">精简注释</button>
          <button type="button" data-mode="none">无注释</button>
        </div>
        <div class="segmented" id="viewModes" role="group" aria-label="视图模式">
          <button type="button" data-view="read">阅读模式</button>
          <button type="button" data-view="practice">练习模式</button>
        </div>
        <div class="toolbar-spacer"></div>
        <span class="kbd-hint" id="kbdHint"></span>
        <button type="button" class="btn btn-ghost" id="btnPrev">← 上一模块</button>
        <button type="button" class="btn btn-ghost" id="btnNext">下一模块 →</button>
      </div>

      <!-- 大模块（链表）的单/双/对比三视图 -->
      <div class="big-tabs" id="bigTabs" hidden></div>

      <section class="pane pane-read" id="paneRead">
        <div class="read-split">
          <!-- 左：动画画面。右：代码。并排才看得见"动画走到哪、代码高亮到哪"（PRD 4.3） -->
          <div class="anim-card" id="animCard" hidden>
            <div class="code-card-head">
              <span class="code-card-title" id="animCardTitle">动画演示</span>
              <div class="code-card-actions">
                <span class="pl-legend">蓝＝已有连接　绿＝本步新建　红＝即将摘除</span>
                <button type="button" class="btn btn-mini" id="btnCollapseAnim">折叠</button>
              </div>
            </div>
            <div class="anim-body" id="animBody"></div>
          </div>

          <div class="code-card">
            <div class="code-card-head">
              <span class="code-card-title" id="readCardTitle"></span>
              <div class="code-card-actions">
                <span class="hint">点代码行可跳到对应动画步骤</span>
                <button type="button" class="btn btn-mini" id="btnCopyCode">复制代码</button>
              </div>
            </div>
            <div class="code-view" id="codeView"></div>
          </div>
        </div>
      </section>

      <section class="pane pane-practice" id="panePractice" hidden>
        <div class="practice-split">
          <div class="editor-card">
            <div class="code-card-head">
              <span class="code-card-title">默写编辑器</span>
              <div class="code-card-actions">
                <span class="hint">Ctrl + Enter 编译运行</span>
                <button type="button" class="btn btn-mini" id="btnScaffold">补全脚手架</button>
                <button type="button" class="btn btn-mini" id="btnBlank">清空</button>
              </div>
            </div>
            <div class="editor" id="editor">
              <div class="editor-gutter"><div class="editor-gutter-inner" id="editorGutter"></div></div>
              <div class="editor-highlight" id="editorHighlight"><code id="editorHighlightCode"></code></div>
              <textarea id="editorInput" class="editor-input" spellcheck="false" wrap="off"
                        autocomplete="off" autocapitalize="off" autocorrect="off"></textarea>
            </div>
            <div class="io-tabs" id="ioTabs">
              <button type="button" data-io="code" class="is-active">代码</button>
              <button type="button" data-io="stdin">输入</button>
            </div>
            <div class="stdin-box" id="stdinBox" hidden>
              <textarea id="stdinInput" spellcheck="false"
                        placeholder="这里写程序运行时从键盘读入的内容（scanf 会依次读它）。留空表示程序不需要输入。"></textarea>
            </div>
          </div>

          <aside class="ref-card" id="refCard">
            <div class="code-card-head">
              <span class="code-card-title" id="refCardTitle">官方实现</span>
              <div class="code-card-actions">
                <button type="button" class="btn btn-mini" id="btnDiff">对比</button>
                <button type="button" class="btn btn-mini" id="btnCollapseRef">折叠</button>
              </div>
            </div>
            <div class="ref-body"><div class="code-view code-view-compact" id="refView"></div></div>
          </aside>
        </div>
      </section>

      <!-- 对比视图：同一个操作，单链表 / 双链表并排 -->
      <section class="pane pane-compare" id="paneCompare" hidden>
        <div class="compare-head">
          <span class="code-card-title" id="compareTitle">对比视图</span>
          <div class="toolbar-spacer"></div>
          <label class="sync-toggle">
            <input type="checkbox" id="syncScroll" checked /> <span>滚动同步</span>
          </label>
          <span class="hint" id="compareHint">红底＝双链表多出来的 prior 相关行</span>
        </div>
        <div class="compare-grid">
          <div class="compare-col">
            <div class="compare-col-head" id="compareLeftHead">单链表</div>
            <div class="code-view code-view-compact" id="compareLeft"></div>
          </div>
          <div class="compare-col">
            <div class="compare-col-head" id="compareRightHead">双链表</div>
            <div class="code-view code-view-compact" id="compareRight"></div>
          </div>
        </div>
      </section>

      <!-- 动画播放器：PRD 4.2，固定在每个模块底部 -->
      <section class="player-panel" id="playerPanel" hidden>
        <div id="playerHost"></div>
      </section>
      <section class="output" id="outputPanel">
        <div class="output-head">
          <button type="button" class="output-toggle" id="btnToggleOutput" aria-expanded="true">
            <span class="caret" id="outputCaret">▾</span><span>输出面板</span>
          </button>
          <div class="output-status" id="outputStatus"></div>
          <div class="toolbar-spacer"></div>
          <button type="button" class="btn btn-primary" id="btnRun" title="Ctrl + Enter">
            <span class="play" aria-hidden="true">▶</span> 运行
          </button>
          <button type="button" class="btn btn-ghost" id="btnCompare">⇄ 对比</button>
        </div>
        <div class="output-body" id="outputBody">
          <div class="output-placeholder" id="outputPlaceholder">
            写完之后按 <b>Ctrl + Enter</b> 编译运行；点「对比」逐行核对与官方实现的差异。
          </div>
          <div class="output-content" id="outputContent" hidden></div>
        </div>
      </section>
    </main>
  </div>

  <footer class="statusbar">
    <div class="sb-group"><span class="sb-dot" id="sbCompilerDot"></span><span id="sbCompiler">正在检测编译器…</span></div>
    <div class="sb-group" id="sbModule">—</div>
    <div class="sb-group sb-state" id="sbState">未修改</div>
    <div class="sb-group sb-right" id="sbVersion"></div>
  </footer>

  <!-- 覆盖清单弹层 -->
  <div class="modal" id="coverageModal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span class="modal-title">模块内容覆盖清单（对照陈越课程大纲）</span>
        <button type="button" class="icon-btn" id="btnCloseCoverage">✕</button>
      </div>
      <div class="modal-body" id="coverageBody"></div>
    </div>
  </div>

  <script src="app/highlight.js"></script>
  <script src="app/diff.js"></script>
  <script src="app/editor.js"></script>
  <script src="app/player.js"></script>
  <script src="app/studio-web.js"></script>
  <script src="app/app.js"></script>
</body>
</html>
